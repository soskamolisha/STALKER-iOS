name: Build iOS starter
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - 'project.yml'
      - 'Tests/**'
      - 'scripts/package_unsigned_ipa.py'
      - '.github/workflows/ios-starter.yml'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native input
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STInput.cpp Tests/InputTests.cpp -o /tmp/stalker-input-tests
          /tmp/stalker-input-tests
      - name: Test portable X-Ray engine bootstrap
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Tests/XRayBootstrapTests.cpp -o /tmp/stalker-xray-bootstrap-tests
          /tmp/stalker-xray-bootstrap-tests
      - name: Test X-Ray Swift bridge C ABI
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Sources/Native/XRayLevelFiles.cpp Sources/Native/XRayChunkIndex.cpp Sources/Native/XRayLevelInspection.cpp Sources/Native/STXRayBootstrap.cpp Tests/XRayBootstrapBridgeTests.cpp -o /tmp/stalker-xray-bridge-tests
          /tmp/stalker-xray-bridge-tests
      - name: Test native X-Ray level catalog
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelCatalog.cpp Tests/XRayLevelCatalogTests.cpp -o /tmp/stalker-xray-level-tests
          /tmp/stalker-xray-level-tests
      - name: Test native X-Ray loose level files
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelFiles.cpp Tests/XRayLevelFilesTests.cpp -o /tmp/stalker-xray-level-files-tests
          /tmp/stalker-xray-level-files-tests
      - name: Test native X-Ray level chunk header
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelHeader.cpp Tests/XRayLevelHeaderTests.cpp -o /tmp/stalker-xray-level-header-tests
          /tmp/stalker-xray-level-header-tests
      - name: Test native X-Ray chunk index
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayChunkIndex.cpp Tests/XRayChunkIndexTests.cpp -o /tmp/stalker-xray-chunk-index-tests
          /tmp/stalker-xray-chunk-index-tests
      - name: Test native X-Ray level inspection
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelFiles.cpp Sources/Native/XRayChunkIndex.cpp Sources/Native/XRayLevelInspection.cpp Tests/XRayLevelInspectionTests.cpp -o /tmp/stalker-xray-inspection-tests
          /tmp/stalker-xray-inspection-tests
      - name: Test native X-Ray bounded chunk payload reader
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayChunkIndex.cpp Sources/Native/XRayChunkPayload.cpp Tests/XRayChunkPayloadTests.cpp -o /tmp/stalker-xray-payload-tests
          /tmp/stalker-xray-payload-tests
      - name: Test native X-Ray collision header
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayCFormHeader.cpp Tests/XRayCFormHeaderTests.cpp -o /tmp/stalker-xray-cform-tests
          /tmp/stalker-xray-cform-tests
      - name: Test archive chunk reader
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Tests/ArchiveChunkTests.cpp -o /tmp/stalker-archive-tests
          /tmp/stalker-archive-tests
      - name: Test native chunk bridge
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STChunks.cpp Tests/NativeChunkBridgeTests.cpp -o /tmp/stalker-chunk-bridge-tests
          /tmp/stalker-chunk-bridge-tests
      - name: Fetch pinned genuine OpenXRay xrCore source
        uses: actions/checkout@v4
        with:
          repository: Eternal-Entropia/openxray-android
          ref: 1b84cfbc5efa3e9af942164e5a3c2dde43b77f51
          path: openxray-upstream
          persist-credentials: false
          sparse-checkout: |
            src/xrCore/crc32.cpp
            License.txt
          sparse-checkout-cone-mode: false
      - name: Stage upstream CRC32 implementation for XcodeGen
        run: |
          test "$(git -C openxray-upstream rev-parse HEAD)" = "1b84cfbc5efa3e9af942164e5a3c2dde43b77f51"
          test -s openxray-upstream/License.txt
          cp openxray-upstream/src/xrCore/crc32.cpp Sources/Native/Upstream/crc32.cpp
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run Swift X-Ray parser self-tests
        run: |
          swiftc Sources/XRayBinaryReader.swift Sources/XRayChunkScanner.swift Sources/XRayArchiveInspector.swift Sources/GameResourceScanner.swift Sources/GameResourceImporter.swift Sources/XRayParserSelfTest.swift Tests/XRayParserTestMain.swift -o /tmp/stalker-xray-parser-tests
          /tmp/stalker-xray-parser-tests
      - name: Build iOS simulator app
        run: |
          xcodebuild -project STALKERiOSStarter.xcodeproj -scheme STALKERiOSStarter -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned physical-device app
        run: |
          xcodebuild -project STALKERiOSStarter.xcodeproj -scheme STALKERiOSStarter -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned prototype IPA
        run: |
          APP="build-device/Build/Products/Debug-iphoneos/STALKERiOSStarter.app"
          lipo "$APP/STALKERiOSStarter" -verify_arch arm64
          python3 scripts/package_unsigned_ipa.py "$APP" STALKERiOSStarter-unsigned.ipa
      - name: Package build outputs
        run: |
          cd build-simulator/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/STALKERiOSStarter-simulator.zip" STALKERiOSStarter.app
          cd "$GITHUB_WORKSPACE/build-device/Build/Products/Debug-iphoneos"
          zip -r "$GITHUB_WORKSPACE/STALKERiOSStarter-unsigned-device.zip" STALKERiOSStarter.app
      - uses: actions/upload-artifact@v4
        with:
          name: STALKERiOSStarter-builds
          if-no-files-found: error
          path: |
            STALKERiOSStarter-unsigned.ipa
            STALKERiOSStarter-simulator.zip
            STALKERiOSStarter-unsigned-device.zip
