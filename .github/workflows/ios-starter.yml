      - name: Build launcher and native bridge unsigned iPhone app
        run: |
          xcodebuild -project LauncherOnly/STALKERLauncherOnly.xcodeproj -scheme STALKERLauncherOnly -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath LauncherOnly/build CODE_SIGNING_ALLOWED=NO build
      - name: Verify artwork and package native bridge IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="LauncherOnly/build/Build/Products/Release-iphoneos/STALKERLauncherOnly.app"
          /usr/bin/lipo "$APP/STALKERLauncherOnly" -verify_arch arm64
          # Xcode strips exported symbols in Release; verify unstripped object files instead.
          OBJDIR="LauncherOnly/build/Build/Intermediates.noindex/STALKERLauncherOnly.build/Release-iphoneos/STALKERLauncherOnly.build/Objects-normal/arm64"
          find "$OBJDIR" -name '*.o' -print0 | xargs -0 xcrun nm -g | grep -F _st_openxray_crc32
