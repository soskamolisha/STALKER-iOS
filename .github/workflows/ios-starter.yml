name: Build iOS starter
on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/ios-starter.yml'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS simulator app
        run: |
          xcodebuild -project STALKERiOSStarter.xcodeproj -scheme STALKERiOSStarter -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned physical-device app
        run: |
          xcodebuild -project STALKERiOSStarter.xcodeproj -scheme STALKERiOSStarter -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package build outputs
        run: |
          cd build-simulator/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/STALKERiOSStarter-simulator.zip" STALKERiOSStarter.app
          cd "$GITHUB_WORKSPACE/build-device/Build/Products/Debug-iphoneos"
          zip -r "$GITHUB_WORKSPACE/STALKERiOSStarter-unsigned-device.zip" STALKERiOSStarter.app
      - uses: actions/upload-artifact@v4
        with:
          name: STALKERiOSStarter-builds
          path: |
            STALKERiOSStarter-simulator.zip
            STALKERiOSStarter-unsigned-device.zip
