name: Build iOS starter
on:
  workflow_dispatch:
  push:
    branches:
      - feature/trilogy-launcher-v3
    paths:
      - 'LauncherOnly/**'
      - 'Sources/**'
      - 'Resources/**'
      - 'Tests/**'
      - 'project.yml'
      - 'scripts/package_unsigned_ipa.py'
      - 'scripts/build_with_openxray.sh'
      - 'scripts/verify_openxray_archive.py'
      - 'scripts/integrate_openxray_artifact.py'
      - '.github/workflows/ios-starter.yml'
concurrency:
  group: ios-starter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable-resource-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional OpenXRay integration script
        run: |
          bash -n scripts/build_with_openxray.sh
          python3 -m py_compile scripts/verify_openxray_archive.py
          python3 -m py_compile scripts/integrate_openxray_artifact.py
          # Artifact ZIP path traversal must be rejected before extraction.
          python3 - <<'PY'
          import tempfile, zipfile, subprocess, sys
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / "malicious.zip"
              with zipfile.ZipFile(path, "w") as z:
                  z.writestr("../escape.a", b"not an engine")
              result = subprocess.run([sys.executable, "scripts/integrate_openxray_artifact.py", str(path)], capture_output=True, text=True)
              assert result.returncode != 0, result.stdout
              assert "unsafe path" in result.stderr, result.stderr
              with zipfile.ZipFile(path, "w") as z:
                  z.writestr("folder\\\\escape.a", b"not an engine")
              result = subprocess.run([sys.executable, "scripts/integrate_openxray_artifact.py", str(path)], capture_output=True, text=True)
              assert result.returncode != 0, result.stdout
              assert "unsafe path" in result.stderr, result.stderr
              path.write_bytes(b"not a zip")
              result = subprocess.run([sys.executable, "scripts/integrate_openxray_artifact.py", str(path)], capture_output=True, text=True)
              assert result.returncode != 0, result.stdout
              assert "invalid artifact ZIP" in result.stderr, result.stderr
              with zipfile.ZipFile(path, "w") as z:
                  z.writestr("first.a", b"fake")
                  z.writestr("second.a", b"fake")
              result = subprocess.run([sys.executable, "scripts/integrate_openxray_artifact.py", str(path)], capture_output=True, text=True)
              assert result.returncode != 0, result.stdout
              assert "expected exactly one static .a archive" in result.stderr, result.stderr
          PY
          # A missing engine archive must fail immediately rather than
          # producing a launcher falsely described as OpenXRay-enabled.
          if bash scripts/build_with_openxray.sh /tmp/does-not-exist-openxray.a > /tmp/openxray-negative.log 2>&1; then
            echo "::error::Missing archive unexpectedly accepted"
            exit 1
          fi
          grep -q 'Missing OpenXRay archive or artifact ZIP' /tmp/openxray-negative.log
          # A missing ZIP should also fail before Xcode or artifact extraction.
          if bash scripts/build_with_openxray.sh /tmp/does-not-exist-openxray.zip > /tmp/openxray-missing-zip.log 2>&1; then
            echo "::error::Missing ZIP unexpectedly accepted"
            exit 1
          fi
          grep -q 'Missing OpenXRay archive or artifact ZIP' /tmp/openxray-missing-zip.log
      - name: Test X-Ray resource import on Linux
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Tests/XRayBootstrapTests.cpp -o /tmp/stalker-xray-bootstrap-tests
          echo "::group::X-Ray resource discovery lifecycle regression"
          set +e
          /tmp/stalker-xray-bootstrap-tests > /tmp/stalker-xray-bootstrap-output.log 2>/tmp/stalker-xray-bootstrap-errors.log
          bootstrap_status=$?
          set -e
          if [ "$bootstrap_status" -ne 0 ]; then
            cat /tmp/stalker-xray-bootstrap-output.log
            cat /tmp/stalker-xray-bootstrap-errors.log
            failing_line=$(sed -n 's/.*XRayBootstrapTests.cpp:\\([0-9][0-9]*\\):.*/\\1/p' /tmp/stalker-xray-bootstrap-errors.log | head -n 1)
            if [ -n "$failing_line" ]; then
              start=$(( failing_line > 5 ? failing_line - 5 : 1 ))
              end=$(( failing_line + 5 ))
              echo "::error file=Tests/XRayBootstrapTests.cpp,line=$failing_line::X-Ray resource inventory assertion failed"
              sed -n "${start},${end}p" Tests/XRayBootstrapTests.cpp | nl -ba -v "$start"
            fi
            exit "$bootstrap_status"
          fi
          echo "::endgroup::"
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Sources/Native/STXRayResourceProbe.cpp Sources/Native/XRayChunkIndex.cpp Sources/Native/XRayChunkPayload.cpp Tests/STXRayResourceProbeTests.cpp -o /tmp/stalker-native-resource-probe-tests
          /tmp/stalker-native-resource-probe-tests
          # Compile upstream miniLZO as C, then exercise the production C++ wrapper.
          cc -std=c99 -O2 -I Sources/Native/Upstream -c Sources/Native/Upstream/minilzo.c -o /tmp/stalker-minilzo.o
          c++ -std=c++17 -Wall -Wextra -Werror -I Sources/Native Sources/Native/STXRayLZO.cpp Tests/STXRayLZOTests.cpp /tmp/stalker-minilzo.o -o /tmp/stalker-minilzo-tests
          /tmp/stalker-minilzo-tests
          # Exercise packed archive and compressed geometry on every Linux push.
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Sources/Native/XRayLevelFiles.cpp Sources/Native/XRayChunkIndex.cpp Sources/Native/XRayLevelInspection.cpp Sources/Native/XRayCFormHeader.cpp Sources/Native/STXRayBootstrap.cpp Sources/Native/STXRayLZO.cpp Sources/Native/STXRayCrypto.cpp Tests/XRayBootstrapBridgeTests.cpp /tmp/stalker-minilzo.o -I Sources/Native/Upstream -o /tmp/stalker-xray-bridge-linux-tests
          echo "::group::X-Ray packed archive bridge regression"
          # Print the exact assertion and its nearby source when a regression fails.
          set +e
          /tmp/stalker-xray-bridge-linux-tests > /tmp/stalker-xray-bridge-output.log 2>/tmp/stalker-xray-bridge-errors.log
          bridge_status=$?
          set -e
          if [ "$bridge_status" -ne 0 ]; then
            cat /tmp/stalker-xray-bridge-output.log
            cat /tmp/stalker-xray-bridge-errors.log
            failing_line=$(sed -n 's/.*XRayBootstrapBridgeTests.cpp:\([0-9][0-9]*\):.*/\1/p' /tmp/stalker-xray-bridge-errors.log | head -n 1)
            if [ -n "$failing_line" ]; then
              start=$(( failing_line > 5 ? failing_line - 5 : 1 ))
              end=$(( failing_line + 5 ))
              echo "::error file=Tests/XRayBootstrapBridgeTests.cpp,line=$failing_line::X-Ray bridge assertion failed"
              sed -n "${start},${end}p" Tests/XRayBootstrapBridgeTests.cpp | nl -ba -v "$start"
            fi
            exit "$bridge_status"
          fi
          echo "::endgroup::"
          # Verify the native controls and geometry bridge on every push,
          # without invoking a paid macOS/iPhoneOS runner.
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STInput.cpp Tests/InputTests.cpp -o /tmp/stalker-input-tests
          /tmp/stalker-input-tests
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STOpenXRayRuntime.cpp Tests/STOpenXRayRuntimeTests.cpp -o /tmp/stalker-openxray-runtime-tests
          /tmp/stalker-openxray-runtime-tests
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STOpenXRayRuntime.cpp Tests/STOpenXRayRuntimeLinkedTests.cpp -o /tmp/stalker-openxray-linked-tests
          /tmp/stalker-openxray-linked-tests
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/STOpenXRayRuntime.cpp Tests/STOpenXRayRuntimeResourceTests.cpp -o /tmp/stalker-openxray-resource-tests
          /tmp/stalker-openxray-resource-tests
          python3 Tests/test_openxray_archive_symbols.py
          python3 Tests/test_openxray_archive_cli.py
          python3 Tests/test_openxray_artifact_import.py
          python3 Tests/test_adapt_fsgame_ios.py
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayCFormHeader.cpp Sources/Native/XRayCFormGeometry.cpp Sources/Native/STXRayMesh.cpp Tests/STXRayMeshBridgeTests.cpp -o /tmp/stalker-mesh-bridge-tests
          /tmp/stalker-mesh-bridge-tests
      - name: Upload X-Ray bridge failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xray-bridge-failure-diagnostics
          path: |
            /tmp/stalker-xray-bridge-errors.log
            /tmp/stalker-xray-bridge-output.log
            /tmp/stalker-xray-bootstrap-errors.log
            /tmp/stalker-xray-bootstrap-output.log
          if-no-files-found: ignore
          retention-days: 7
  xray-ios-native-probe:
    # Experimental arm64 iPhoneOS compilation; does not alter the working launcher IPA.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Probe X-Ray native bridge on iPhoneOS' || github.event.head_commit.message == 'Build integrated X-Ray native bridge and iOS runtime diagnostics' || github.event.head_commit.message == 'Compile miniLZO decoder for iPhoneOS ARM64' || github.event.head_commit.message == 'Compile full resource bridge for iPhoneOS ARM64' || github.event.head_commit.message == 'Verify iPhone ARM64 archive decoder symbols' }}
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile native X-Ray resource bridge and input for iPhone ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          mkdir -p build/xray-ios-probe
          for source in Sources/Native/STOpenXRayRuntime.cpp Sources/Native/STInput.cpp; do
            name="$(basename "${source%.cpp}")"
            "$CXX" -std=c++17 -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
              -Wall -Wextra -c "$source" -o "build/xray-ios-probe/$name.o"
          done
          # Compile the actual GPL miniLZO codec and its production C++ wrapper for arm64 iPhoneOS.
          CC="$(xcrun --sdk iphoneos --find clang)"
          "$CC" -std=c99 -O2 -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
            -I Sources/Native/Upstream -c Sources/Native/Upstream/minilzo.c \
            -o build/xray-ios-probe/minilzo.o
          "$CXX" -std=c++17 -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
            -Wall -Wextra -Werror -I Sources/Native \
            -c Sources/Native/STXRayLZO.cpp -o build/xray-ios-probe/STXRayLZO.o
          # Compile the archive/decompression bridge with its native dependencies.
          for source in XRayBootstrap XRayLevelCatalog XRayLevelFiles XRayChunkIndex XRayLevelInspection XRayCFormHeader STXRayBootstrap STXRayCrypto; do
            "$CXX" -std=c++17 -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
              -Wall -Wextra -Werror -I Sources/Native/Upstream \
              -c "Sources/Native/$source.cpp" -o "build/xray-ios-probe/$source.o"
          done
          xcrun --sdk iphoneos ar rcs build/xray-ios-probe/libSTXRayBridgeProbe.a build/xray-ios-probe/*.o
          xcrun lipo -info build/xray-ios-probe/libSTXRayBridgeProbe.a
          # Fail the iPhone build if the decoder or resource APIs are missing.
          xcrun nm -g build/xray-ios-probe/libSTXRayBridgeProbe.a > build/xray-ios-probe/symbols.txt
          grep -q '_st_xray_lzo_decompress' build/xray-ios-probe/symbols.txt
          grep -q '_st_xray_archive_directory_auto_decrypt' build/xray-ios-probe/symbols.txt
          grep -q '_st_xray_archive_file_decompress' build/xray-ios-probe/symbols.txt
          grep -q '_lzo1x_decompress_safe' build/xray-ios-probe/symbols.txt
          echo "Native bridge compiles for iPhoneOS ARM64; full engine and renderer are NOT linked."
      - uses: actions/upload-artifact@v4
        with:
          name: STXRay-iPhoneOS-ARM64-bridge-probe
          path: build/xray-ios-probe/libSTXRayBridgeProbe.a
          retention-days: 14
  xray-ios-link-smoke:
    # Separate experimental iOS app; the production launcher remains unchanged.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Link X-Ray native bridge into experimental iOS app' || github.event.head_commit.message == 'Build integrated X-Ray native bridge and iOS runtime diagnostics' || github.event.head_commit.message == 'Fix UIKit linkage for X-Ray iOS smoke app' || github.event.head_commit.message == 'Verify X-Ray engine entry safety in iOS smoke app' || github.event.head_commit.message == 'Fix native smoke source newline escaping' || github.event.head_commit.message == 'Show X-Ray runtime diagnostics in experimental IPA' || github.event.head_commit.message == 'Fix X-Ray diagnostics source formatting' }}
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Create native bridge smoke-test iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p XRayLinkSmoke
          cat > XRayLinkSmoke/main.mm <<'OBJC'
          #import <UIKit/UIKit.h>
          #include "../Sources/Native/STInput.h"
          #include "../Sources/Native/STOpenXRayRuntime.h"
          @interface SmokeAppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation SmokeAppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)options {
              STInput *input = st_input_create();
              st_input_set(input, 4, 1);
              const BOOL inputOK = (st_input_snapshot(input) == (1u << 4));
              st_input_destroy(input);
              const BOOL runtimeAbsent = (st_openxray_runtime_linked() == 0);
              const BOOL resourceEntryAbsent = (st_openxray_runtime_resources_linked() == 0);
              const BOOL absentEntryRejectsLaunch = (st_openxray_runtime_run("-soc -nointro -nosplash") == -1);
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController *controller = [UIViewController new];
              controller.view.backgroundColor = UIColor.blackColor;
              UILabel *label = [UILabel new];
              NSString *diagnostics = [NSString stringWithFormat:@"X-Ray native bridge: %@\\nEngine runtime: %@\\nResource-aware entry: %@\\nInput controls: %@\\nGameplay: unavailable", runtimeAbsent ? @"not linked" : @"linked", resourceEntryAbsent ? @"not linked" : @"linked", inputOK ? @"OK" : @"FAILED"];
              label.text = inputOK && absentEntryRejectsLaunch ? diagnostics : @"Native bridge smoke test failed";
              label.textColor = UIColor.whiteColor;
              label.numberOfLines = 0;
              label.textAlignment = NSTextAlignmentCenter;
              label.frame = controller.view.bounds;
              label.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [controller.view addSubview:label];
              self.window.rootViewController = controller;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end
          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([SmokeAppDelegate class])); }
          }
          OBJC
          cat > XRayLinkSmoke/project.yml <<'YAML'
          name: XRayLinkSmoke
          options:
            deploymentTarget:
              iOS: "17.0"
          targets:
            XRayLinkSmoke:
              type: application
              platform: iOS
              sources:
                - path: main.mm
                - path: ../Sources/Native/STInput.cpp
                - path: ../Sources/Native/STOpenXRayRuntime.cpp
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stalkermobile.xraylinksmoke
                  CLANG_ENABLE_MODULES: "YES"
                  CLANG_ENABLE_OBJC_ARC: "YES"
                  OTHER_LDFLAGS: "-framework UIKit -framework Foundation"
                  GENERATE_INFOPLIST_FILE: "YES"
                  INFOPLIST_KEY_UIFileSharingEnabled: "YES"
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
                  CODE_SIGNING_ALLOWED: "NO"
          YAML
          brew install xcodegen
          (cd XRayLinkSmoke && xcodegen generate)
          xcodebuild -project XRayLinkSmoke/XRayLinkSmoke.xcodeproj -scheme XRayLinkSmoke -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath XRayLinkSmoke/build CODE_SIGNING_ALLOWED=NO build
          APP="XRayLinkSmoke/build/Build/Products/Release-iphoneos/XRayLinkSmoke.app"
          xcrun lipo "$APP/XRayLinkSmoke" -verify_arch arm64
          python3 scripts/package_unsigned_ipa.py "$APP" XRayLinkSmoke-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: XRay-Native-Link-Smoke-IPA
          path: XRayLinkSmoke-unsigned.ipa
          retention-days: 14
  launcher-native-bridge-ipa:
    if: ${{ github.event.head_commit.message == 'Build updated STALKER Mobile LZO diagnostics IPA' || github.event.head_commit.message == 'Build STALKER launcher with native X-Ray bridge IPA' || github.event.head_commit.message == 'Build Files-accessible STALKER Mobile X-Ray bridge IPA' || github.event.head_commit.message == 'Rebuild iOS bridge after optional engine link fix' || github.event.head_commit.message == 'Build bridge with native engine resource preflight diagnostics' || github.event.head_commit.message == 'Build X-Ray bridge with named archive inventory' || github.event.head_commit.message == 'Build X-Ray bridge with automatic Files resource rescan' || github.event.head_commit.message == 'Fix iOS Files visibility with verified boolean plist keys' || github.event.head_commit.message == 'Rebuild integrated X-Ray bridge IPA after Swift fixes' || github.event.head_commit.message == 'Build integrated X-Ray native bridge and iOS runtime diagnostics' || github.event.head_commit.message == 'Add Shadow of Chernobyl resource preflight to X-Ray launcher' || github.event.head_commit.message == 'Add Shadow of Chernobyl folder importer to X-Ray launcher' || github.event.head_commit.message == 'Fix Swift source line breaks in folder importer' || github.event.head_commit.message == 'Fix resource import SwiftUI view placement' || github.event.head_commit.message == 'Show X-Ray diagnostics on selected game screen' || github.event.head_commit.message == 'Validate nonempty X-Ray config in launcher' || github.event.head_commit.message == 'Fix launcher folder importer workflow YAML' || github.event.head_commit.message == 'Embed upstream OpenXRay CRC32 into STALKER launcher IPA' || github.event.head_commit.message == 'Verify embedded OpenXRay CRC32 symbol in launcher IPA' || github.event.head_commit.message == 'Integrate upstream OpenXRay math sample into iOS launcher' || github.event.head_commit.message == 'Fix stripped release binary X-Ray symbol verification' || github.event.head_commit.message == 'Tighten Shadow of Chernobyl resource archive detection' || github.event.head_commit.message == 'Report imported X-Ray archive inventory' || github.event.head_commit.message == 'Fix Swift archive inventory diagnostic string' || github.event.head_commit.message == 'Link native X-Ray resource bootstrap into launcher' || github.event.head_commit.message == 'Wire X-Ray archive chunk inspector into iOS launcher' || github.event.head_commit.message == 'Build X-Ray chunk metadata diagnostics on iPhone' || github.event.head_commit.message == 'Link bounded X-Ray chunk payload reader into launcher' || github.event.head_commit.message == 'Verify hardened X-Ray payload reader on iOS' || github.event.head_commit.message == 'Verify hardened X-Ray archive indexer on iOS' || github.event.head_commit.message == 'Build upstream CRC32 archive payload probe on iOS' || github.event.head_commit.message == 'Display native X-Ray archive CRC diagnostic on iPhone' || github.event.head_commit.message == 'Show X-Ray archive directory chunk on iPhone' || github.event.head_commit.message == 'Show native X-Ray directory CRC on iPhone' || github.event.head_commit.message == 'Verify X-Ray directory payload reader in iOS launcher' || github.event.head_commit.message == 'Show X-Ray directory entry count on iPhone' || github.event.head_commit.message == 'Display first validated X-Ray archive filename on iPhone' || github.event.head_commit.message == 'List first three validated X-Ray archive filenames on iPhone' || github.event.head_commit.message == 'Link miniLZO resource bridge into experimental launcher IPA' || github.event.head_commit.message == 'Show LZO archive directory decoding status in experimental launcher' || github.event.head_commit.message == 'Detect encrypted X-Ray archive directory keys on iPhone' || github.event.head_commit.message == 'Scan LZO directories across imported X-Ray archives' || github.event.head_commit.message == 'Count validated decoded files in X-Ray archives on iPhone' || github.event.head_commit.message == 'Display first decoded X-Ray archive file name on iPhone' || github.event.head_commit.message == 'Show first decoded X-Ray file sizes and compression on iPhone' || github.event.head_commit.message == 'Display first decoded X-Ray file data offset and CRC metadata' || github.event.head_commit.message == 'Guard decoded X-Ray file metadata bounds' || github.event.head_commit.message == 'Check decoded X-Ray file offsets against archive size' || github.event.head_commit.message == 'Avoid aggregate archive size in per-file offset diagnostics' || github.event.head_commit.message == 'Read bounded raw X-Ray file prefix on iPhone' || github.event.head_commit.message == 'Decode bounded compressed X-Ray file sample on iPhone' || github.event.head_commit.message == 'Verify CRC32 for bounded decoded X-Ray file on iPhone' || github.event.head_commit.message == 'Verify CRC32 for small uncompressed X-Ray archive entries' || github.event.head_commit.message == 'Reject malformed decoded X-Ray file record length' || github.event.head_commit.message == 'Show explicit bounds for X-Ray archive diagnostic sample' || github.event.head_commit.message == 'Flag X-Ray archive file CRC mismatch in diagnostic summary' || github.event.head_commit.message == 'Reject invalid X-Ray decoded file path in iPhone diagnostics' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream OpenXRay xrCore source
        uses: actions/checkout@v4
        with:
          repository: Eternal-Entropia/openxray-android
          ref: 1b84cfbc5efa3e9af942164e5a3c2dde43b77f51
          path: openxray-upstream
          persist-credentials: false
          sparse-checkout: |
            src/xrCore/crc32.cpp
            src/xrCore/Math/fast_lc16.hpp
            License.txt
          sparse-checkout-cone-mode: false
      - name: Prepare launcher with X-Ray native bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LauncherOnly/Assets.xcassets/AppIcon.appiconset
          cp Resources/card_*.jpg LauncherOnly/
          if [ -f Resources/panorama_pripyat.png ]; then cp Resources/panorama_pripyat.png LauncherOnly/panorama_pripyat.png; elif [ -f Resources/panorama_pripyat.png.PNG ]; then cp Resources/panorama_pripyat.png.PNG LauncherOnly/panorama_pripyat.png; else echo "Missing panorama"; exit 1; fi
          if [ -f Resources/stalker_mobile_title.png ]; then cp Resources/stalker_mobile_title.png LauncherOnly/stalker_mobile_title.png; elif [ -f Resources/stalker_mobile_title.png.PNG ]; then cp Resources/stalker_mobile_title.png.PNG LauncherOnly/stalker_mobile_title.png; else echo "Missing title logo"; exit 1; fi
          sips -s format png -z 1024 1024 Resources/AppIcon.png --out LauncherOnly/Assets.xcassets/AppIcon.appiconset/icon.png >/dev/null
          cat > LauncherOnly/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > LauncherOnly/project.yml <<'YAML'
          name: STALKERLauncherOnly
          options:
            deploymentTarget:
              iOS: "17.0"
          targets:
            STALKERLauncherOnly:
              type: application
              platform: iOS
              sources:
                - path: LauncherOnlyApp.swift
                - path: XRayStatus.swift
                - path: ../Sources/Native/STOpenXRayRuntime.cpp
                - path: ../Sources/Native/STInput.cpp
                - path: ../Sources/Native/STXRayResourceProbe.cpp
                - path: ../Sources/Native/XRayBootstrap.cpp
                - path: ../Sources/Native/XRayLevelCatalog.cpp
                - path: ../Sources/Native/XRayChunkIndex.cpp
                - path: ../Sources/Native/XRayChunkPayload.cpp
                - path: ../Sources/Native/STXRayBootstrap.cpp
                - path: ../Sources/Native/STXRayLZO.cpp
                - path: ../Sources/Native/STXRayCrypto.cpp
                - path: ../Sources/Native/XRayLevelFiles.cpp
                - path: ../Sources/Native/XRayLevelInspection.cpp
                - path: ../Sources/Native/XRayCFormHeader.cpp
                - path: ../Sources/Native/Upstream/minilzo.c
                - path: ../openxray-upstream/src/xrCore/crc32.cpp
                - path: ../Tests/OpenXRayCRCProbe.cpp
                - path: ../Tests/OpenXRayMathProbe.cpp
                - path: Assets.xcassets
                - path: card_shadow.jpg
                  buildPhase: resources
                - path: card_clearSky.jpg
                  buildPhase: resources
                - path: card_pripyat.jpg
                  buildPhase: resources
                - path: panorama_pripyat.png
                  buildPhase: resources
                - path: stalker_mobile_title.png
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stalkermobile.ios
                  SWIFT_VERSION: "5.0"
                  CLANG_CXX_LANGUAGE_STANDARD: "c++17"
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/../Tests/OpenXRayCompat $(SRCROOT)/../openxray-upstream/src/xrCore/Math $(SRCROOT)/../Sources/Native/Upstream"
                  TARGETED_DEVICE_FAMILY: "1"
