          private func xrayDestroy(_ handle: UnsafeMutableRawPointer?)
          @_silgen_name("st_xray_initialize")
          private func xrayInitialize(_ handle: UnsafeMutableRawPointer?, _ edition: Int32) -> Int32
          @_silgen_name("st_xray_attach_resources")
          private func xrayAttachResources(_ handle: UnsafeMutableRawPointer?, _ path: UnsafePointer<CChar>) -> Int32
          @_silgen_name("st_xray_archive_directory_auto_decrypt")
          private func xrayDecodeDirectory(_ handle: UnsafeMutableRawPointer?, _ archive: UInt32, _ destination: UnsafeMutableRawPointer, _ capacity: UInt32, _ actual: UnsafeMutablePointer<UInt32>, _ key: UnsafeMutablePointer<Int32>) -> Int32
          @_silgen_name("st_xray_validate_directory_records")
          private func xrayValidateDirectory(_ bytes: UnsafeRawPointer, _ length: UInt32) -> Int32
          @_silgen_name("st_xray_archive_read")
          private func xrayArchiveRead(_ handle: UnsafeMutableRawPointer?, _ archive: UInt32, _ offset: UInt64, _ destination: UnsafeMutableRawPointer, _ size: UInt32) -> Int32
          @_silgen_name("st_xray_lzo_decompress")
          private func xrayLZODecompress(_ source: UnsafeRawPointer, _ sourceSize: UInt32, _ destination: UnsafeMutableRawPointer, _ capacity: UInt32, _ expected: UInt32) -> Int32
          enum XRayStatus {
              static var nativeResourceProbe: String {
                  let documents = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let root = documents.appendingPathComponent("ShadowOfChernobyl", isDirectory: true)
                  var count: UInt32 = 0
                  var bytes: UInt64 = 0
                  var levels: UInt32 = 0
                  let result = root.path.withCString { path in
                      xrayProbeShadowResources(path, &count, &bytes, &levels)
                  }
                  var chunks: UInt32 = 0
                  let chunkResult = root.path.withCString { path in
                      xrayProbeFirstArchiveChunks(path, &chunks)
                  }
                  var firstID: UInt32 = 0
                  var firstSize: UInt32 = 0
                  var firstCompressed: Int32 = 0
                  let infoResult = root.path.withCString { path in
                      xrayProbeFirstChunkInfo(path, 0, &firstID, &firstSize, &firstCompressed)
                  }
                  var firstCRC: UInt32 = 0
                  let crcResult = root.path.withCString { path in
                      xrayProbeFirstChunkCRC(path, 0, &firstCRC)
                  }
                  let crcStatus = crcResult == 0 ? ", first chunk CRC32: " + String(firstCRC, radix: 16) : ", first chunk CRC32: unavailable (" + String(crcResult) + ")"
                  var directoryIndex: UInt32 = 0
                  var directorySize: UInt32 = 0
                  var directoryCompressed: Int32 = 0
                  let directoryResult = root.path.withCString { path in
                      xrayProbeDirectory(path, &directoryIndex, &directorySize, &directoryCompressed)
                  }
                  var directoryCRC: UInt32 = 0
                  let directoryCRCResult = root.path.withCString { path in
                      xrayProbeDirectoryCRC(path, &directoryCRC)
                  }
                  let directoryCRCStatus = directoryCRCResult == 0
                      ? ", CRC32: " + String(directoryCRC, radix: 16)
                      : ", CRC32 unavailable (" + String(directoryCRCResult) + ")"
                  var directoryReadBytes: UInt32 = 0
                  var directoryBuffer = [UInt8](repeating: 0, count: 65536)
                  let directoryReadResult = directoryBuffer.withUnsafeMutableBytes { buffer in
                      root.path.withCString { path in
                          xrayProbeDirectoryRead(path, buffer.baseAddress!, UInt32(buffer.count), &directoryReadBytes)
                      }
                  }
                  let directoryReadStatus = directoryReadResult == 0
                      ? ", bytes read: " + String(directoryReadBytes)
                      : ", read unavailable (" + String(directoryReadResult) + ")"
                  var directoryEntries: UInt32 = 0
                  let directoryEntriesResult = root.path.withCString { path in
                      xrayProbeDirectoryEntries(path, &directoryEntries)
                  }
                  let directoryEntriesStatus = directoryEntriesResult == 0
                      ? ", validated entries: " + String(directoryEntries)
                      : ", entries unavailable (" + String(directoryEntriesResult) + ")"
                  var sampleNames: [String] = []
                  if directoryEntriesResult == 0 {
                      for index in 0..<min(directoryEntries, UInt32(3)) {
                          var nameBuffer = [CChar](repeating: 0, count: 4097)
                          let nameResult = nameBuffer.withUnsafeMutableBufferPointer { buffer in
                              root.path.withCString { path in
                                  xrayProbeDirectoryName(path, index, buffer.baseAddress!, UInt32(buffer.count))
                              }
                          }
                          if nameResult == 0 {
                              sampleNames.append(String(cString: nameBuffer))
                          } else {
                              sampleNames.append("unavailable (" + String(nameResult) + ")")
                          }
                      }
                  }
                  let directoryNameStatus = sampleNames.isEmpty
                      ? ", file names unavailable"
                      : ", sample files: " + sampleNames.joined(separator: "; ")
                  var lzoStatus = ", LZO directory: not checked"
                  if result == 0, let engine = xrayCreate() {
                      defer { xrayDestroy(engine) }
                      let initialized = xrayInitialize(engine, 0)
                      let attached = initialized == 0
                          ? root.path.withCString { xrayAttachResources(engine, $0) }
                          : initialized
                      if attached == 0 {
                          var archiveReports: [String] = []
                          for archiveIndex in 0..<min(count, UInt32(8)) {
                              // Keep each archive's memory and retry diagnostics independent.
                              var decoded = [UInt8](repeating: 0, count: 256 * 1024)
                              let initialCapacity = decoded.count
                              var didRetry = false
                              var decodedBytes: UInt32 = 0
                              var keyUsed: Int32 = -2
                              var decodeResult = decoded.withUnsafeMutableBytes { buffer in
                                  xrayDecodeDirectory(engine, archiveIndex, buffer.baseAddress!, UInt32(buffer.count), &decodedBytes, &keyUsed)
                              }
                              if decodeResult == -6 && decodedBytes > UInt32(decoded.count) &&
                                 decodedBytes <= 64 * 1024 * 1024 {
                                  didRetry = true
                                  decoded = [UInt8](repeating: 0, count: Int(decodedBytes))
                                  decodeResult = decoded.withUnsafeMutableBytes { buffer in
                                      xrayDecodeDirectory(engine, archiveIndex, buffer.baseAddress!, UInt32(buffer.count), &decodedBytes, &keyUsed)
                                  }
                              }
                              let fileCount: Int32 = decodeResult == 0
                                  ? decoded.withUnsafeBytes { buffer in
                                      xrayValidateDirectory(buffer.baseAddress!, decodedBytes)
                                  }
                                  : -1
                              var firstFile = ""
                              if fileCount > 0 && decodedBytes >= 19 {
                                  let recordSize = Int(decoded[0]) | (Int(decoded[1]) << 8)
                                  let nameLength = recordSize - 16
                                  if recordSize >= 17 && recordSize <= 4096 &&
                                     nameLength > 0 && 2 + recordSize <= Int(decodedBytes) {
                                      let nameBytes = Array(decoded[14..<(14 + nameLength)])
                                      if let name = String(bytes: nameBytes, encoding: .utf8),
                                         !name.isEmpty, !name.hasPrefix("/"), !name.hasPrefix("\\\\"),
                                         !name.contains(":"), !name.contains("\\0"),
                                         !name.split(whereSeparator: { $0 == "/" || String($0) == "\\\\" }).contains(where: { $0 == "." || $0 == ".." }) {
                                          let realSize = UInt32(decoded[2]) | (UInt32(decoded[3]) << 8) | (UInt32(decoded[4]) << 16) | (UInt32(decoded[5]) << 24)
                                          let storedSize = UInt32(decoded[6]) | (UInt32(decoded[7]) << 8) | (UInt32(decoded[8]) << 16) | (UInt32(decoded[9]) << 24)
                                          let fileCRC = UInt32(decoded[10]) | (UInt32(decoded[11]) << 8) | (UInt32(decoded[12]) << 16) | (UInt32(decoded[13]) << 24)
                                          let offsetIndex = 14 + nameLength
                                          let dataOffset = UInt32(decoded[offsetIndex]) | (UInt32(decoded[offsetIndex + 1]) << 8) | (UInt32(decoded[offsetIndex + 2]) << 16) | (UInt32(decoded[offsetIndex + 3]) << 24)
                                          let offsetValid = dataOffset >= 8 && UInt64(dataOffset) + UInt64(storedSize) <= UInt64(UInt32.max)
                                          var prefixStatus = ", prefix: skipped (file larger than diagnostic limit or unsupported)"
                                          var fileIntegrity = "NOT_CHECKED"
                                          if offsetValid && realSize == storedSize && storedSize > 0 {
                                              let sampleLength = min(storedSize, UInt32(16))
                                              var sample = [UInt8](repeating: 0, count: Int(sampleLength))
                                              let sampleResult = sample.withUnsafeMutableBytes { buffer in
                                                  xrayArchiveRead(engine, archiveIndex, UInt64(dataOffset), buffer.baseAddress!, sampleLength)
                                              }
                                              prefixStatus = sampleResult == 0
                                                  ? ", raw prefix: " + sample.map { String(format: "%02x", $0) }.joined()
                                                  : ", raw prefix error: " + String(sampleResult)
                                          }
                                          if offsetValid && realSize == storedSize &&
                                             realSize > 0 && realSize <= 65536 {
                                              var rawFile = [UInt8](repeating: 0, count: Int(realSize))
                                              let rawResult = rawFile.withUnsafeMutableBytes { buffer in
                                                  xrayArchiveRead(engine, archiveIndex, UInt64(dataOffset), buffer.baseAddress!, realSize)
                                              }
                                              if rawResult == 0 {
                                                  let actualCRC = rawFile.withUnsafeBytes { bytes in
                                                      openXRayCRC32(bytes.baseAddress!, realSize)
                                                  }
                                                  fileIntegrity = actualCRC == fileCRC ? "PASS" : "MISMATCH"
                                                  prefixStatus += ", CRC32 " + fileIntegrity + " (" + String(actualCRC, radix: 16) + ")"
                                              } else {
                                                  prefixStatus += ", CRC32 read error: " + String(rawResult)
                                              }
                                          }
                                          if offsetValid && realSize != storedSize &&
                                             realSize > 0 && storedSize > 0 &&
                                             realSize <= 65536 && storedSize <= 65536 {
                                              var compressedData = [UInt8](repeating: 0, count: Int(storedSize))
                                              let readResult = compressedData.withUnsafeMutableBytes { buffer in
                                                  xrayArchiveRead(engine, archiveIndex, UInt64(dataOffset), buffer.baseAddress!, storedSize)
                                              }
                                              if readResult == 0 {
                                                  var expanded = [UInt8](repeating: 0, count: Int(realSize))
                                                  let decodeFileResult = compressedData.withUnsafeBytes { source in
                                                      expanded.withUnsafeMutableBytes { destination in
                                                          xrayLZODecompress(source.baseAddress!, storedSize, destination.baseAddress!, realSize, realSize)
                                                      }
                                                  }
                                                  let decodedCRC: UInt32 = decodeFileResult == 0
                                                      ? expanded.withUnsafeBytes { bytes in
                                                          openXRayCRC32(bytes.baseAddress!, realSize)
                                                      }
                                                      : 0
                                                  if decodeFileResult == 0 { fileIntegrity = decodedCRC == fileCRC ? "PASS" : "MISMATCH" }
                                                  prefixStatus = decodeFileResult == 0
                                                      ? ", LZO file prefix: " + expanded.prefix(16).map { String(format: "%02x", $0) }.joined() + ", CRC32 " + (decodedCRC == fileCRC ? "PASS" : "MISMATCH") + " (" + String(decodedCRC, radix: 16) + ")"
                                                      : ", LZO file error: " + String(decodeFileResult)
                                              } else {
                                                  prefixStatus = ", compressed file read error: " + String(readResult)
                                              }
                                          }
                                          firstFile = ", first file: " + name + " (" + String(realSize) + " bytes, stored " + String(storedSize) + ", " + (realSize == storedSize ? "raw" : "compressed") + ", offset " + String(dataOffset) + ", CRC " + String(fileCRC, radix: 16) + ", offset check " + (offsetValid ? "integer bounds OK; archive EOF checked on read" : "invalid") + prefixStatus + ", integrity " + fileIntegrity + ")"
                                      }
                                  }
                              }
                              let report = decodeResult == 0
                                  ? "db[" + String(archiveIndex) + "]: " + String(decodedBytes) + " bytes, files " + String(fileCount) + firstFile + ", buffer " + String(initialCapacity) + " -> " + String(decoded.count) + (didRetry ? " (retry)" : "") + ", key " + (keyUsed == -1 ? "none" : keyUsed == 0 ? "worldwide" : keyUsed == 1 ? "Russian" : "unknown")
                                  : "db[" + String(archiveIndex) + "]: error " + String(decodeResult) + ", attempted buffer " + String(decoded.count) + " bytes" + (didRetry ? " (retried)" : "") + (decodeResult == -6 ? " (needs " + String(decodedBytes) + " bytes)" : decodeResult == -4 ? " (LZO stream or encryption not recognized)" : decodeResult == -5 ? " (invalid decoded records)" : "")
                              archiveReports.append(report)
                          }
                          lzoStatus = ", LZO directories: " + archiveReports.joined(separator: "; ")
                      } else {
                          lzoStatus = ", LZO resources unavailable (" + String(attached) + ")"
                      }
                  }
                  let directoryStatus = directoryResult == 0
                      ? ". Directory chunk: " + String(directoryIndex) + ", size: " + String(directorySize) + ", compressed: " + String(directoryCompressed) + directoryCRCStatus + directoryReadStatus + directoryEntriesStatus + directoryNameStatus
                      : ". Directory chunk: unavailable (" + String(directoryResult) + ")"
                  let firstInfo = infoResult == 0 ? ", first chunk ID: " + String(firstID) + ", size: " + String(firstSize) + ", compressed: " + String(firstCompressed) + crcStatus : ""
                  let chunkStatus = chunkResult == 0 ? "First archive chunks: " + String(chunks) + firstInfo + directoryStatus : "First archive chunk scan: unavailable (" + String(chunkResult) + ")"
                  return result == 0
                      ? "Native X-Ray resources: READY, archives: " + String(count) + ", bytes: " + String(bytes) + ", loose levels: " + String(levels) + ". " + chunkStatus + lzoStatus
                      : "Native X-Ray resources: NOT READY (code " + String(result) + ")"
              }
              static var xrMathCheck: String {
                  let a = openXRayMathSample(123)
                  let b = openXRayMathSample(123)
                  let c = openXRayMathSample(124)
                  return a == b && a != c ? "xrCore math: PASS (on device)" : "xrCore math: FAIL"
              }
              static var xrCoreCheck: String {
                  let bytes = Array("123456789".utf8)
                  let crc = bytes.withUnsafeBytes { raw in openXRayCRC32(raw.baseAddress!, UInt32(raw.count)) }
                  return crc == 0xCBF43926 ? "xrCore CRC32: PASS (on device)" : "xrCore CRC32: FAIL"
              }
              static var summary: String {
                  "X-RAY BRIDGE · " + (xrayRuntimeLinked() == 1 ? "RUNTIME LINKED" : "ENGINE NOT LINKED")
              }
              static var runtimePreflight: String {
                  let root = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("ShadowOfChernobyl", isDirectory: true)
                  let code = root.path.withCString { xrayRuntimePreflight($0) }
                  return "Engine resource preflight: " + String(code) + " (" + String(cString: xrayRuntimeStatusMessage(code)) + ")"
              }
              static var details: String {
                  "Native X-Ray bridge: linked. Runtime: " + (xrayRuntimeLinked() == 1 ? "linked" : "not linked") +
                  ". Resource entry: " + (xrayResourceEntryLinked() == 1 ? "linked" : "not linked") +
                  ". " + xrCoreCheck + ". " + xrMathCheck + ". " + runtimePreflight + ". " + nativeResourceProbe + ". " + resourcePreflight + ". Gameplay is not available yet."
              }
              static var resourcePreflight: String {
                  let documents = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let root = documents.appendingPathComponent("ShadowOfChernobyl", isDirectory: true)
                  let config = root.appendingPathComponent("fsgame.ltx")
                  let gamedata = root.appendingPathComponent("gamedata", isDirectory: true)
                  let archives = (try? FileManager.default.contentsOfDirectory(atPath: root.path))?.filter { name in
                      let lower = name.lowercased()
                      guard lower.hasPrefix("gamedata.db") else { return false }
                      let suffix = lower.dropFirst("gamedata.db".count)
                      guard (1...2).contains(suffix.count),
                            suffix.allSatisfy({ $0.isASCII && $0.isLetter || $0.isASCII && $0.isNumber }) else { return false }
                      let path = root.appendingPathComponent(name).path
                      var isDirectory: ObjCBool = false
                      guard FileManager.default.fileExists(atPath: path, isDirectory: &isDirectory),
                            !isDirectory.boolValue else { return false }
                      let size = (try? FileManager.default.attributesOfItem(atPath: path)[.size] as? NSNumber)?.int64Value ?? 0
                      return size > 0
                  } ?? []
                  let configSize = (try? FileManager.default.attributesOfItem(atPath: config.path)[.size] as? NSNumber)?.int64Value ?? 0
                  var isDirectory: ObjCBool = false
                  let dataFolder = FileManager.default.fileExists(atPath: gamedata.path, isDirectory: &isDirectory) && isDirectory.boolValue
                  let dataExists = dataFolder || !archives.isEmpty
                  let archiveBytes = archives.reduce(Int64(0)) { sum, name in
                      let path = root.appendingPathComponent(name).path
                      let size = (try? FileManager.default.attributesOfItem(atPath: path)[.size] as? NSNumber)?.int64Value ?? 0
                      return sum > Int64.max - size ? sum : sum + size
                  }
                  let names = archives.sorted().map { name -> String in
                      let path = root.appendingPathComponent(name).path
                      let bytes = (try? FileManager.default.attributesOfItem(atPath: path)[.size] as? NSNumber)?.int64Value ?? 0
                      return name + " (" + String(bytes) + " B)"
                  }
                  let rootNames = (try? FileManager.default.contentsOfDirectory(atPath: root.path))?.sorted() ?? []
                  let listed = names.isEmpty ? "none" : names.joined(separator: ", ")
                  let inventory = "Archives: " + String(archives.count) + ", bytes: " + String(archiveBytes) + ", loose gamedata: " + (dataFolder ? "present" : "absent") + ", fsgame.ltx: " + (configSize > 0 ? "present" : "missing") + ". Archive files: " + listed + ". Root items: " + rootNames.prefix(16).joined(separator: ", ") + ". "
                  return "ShadowOfChernobyl resources: " + inventory + (configSize > 0 && dataExists ? "candidate files detected (not validated)" : "missing nonempty fsgame.ltx or gamedata/archives")
              }
          }
          SWIFT
