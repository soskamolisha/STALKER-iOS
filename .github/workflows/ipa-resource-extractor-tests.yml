name: StalkerMobile IPA resource extractor
on:
  push:
    branches: [feature/trilogy-launcher-v3]
    paths:
      - 'scripts/extract_stalkermobile_ipa_resources.py'
      - 'Tests/test_extract_stalkermobile_ipa_resources.py'
      - '.github/workflows/ipa-resource-extractor-tests.yml'
  pull_request:
    paths:
      - 'scripts/extract_stalkermobile_ipa_resources.py'
      - 'Tests/test_extract_stalkermobile_ipa_resources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test IPA resource extraction and path safety
        run: python3 -m unittest discover -s Tests -p 'test_extract_stalkermobile_ipa_resources.py' -v
