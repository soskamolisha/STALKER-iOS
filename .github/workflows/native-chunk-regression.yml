name: Native chunk regression
on:
  push:
    branches:
      - feature/trilogy-launcher-v3
    paths:
      - 'Sources/Native/STChunks.cpp'
      - 'Sources/Native/STChunks.h'
      - 'Sources/Native/STLZOAdapter.cpp'
      - 'Sources/Native/STLZOAdapter.h'
      - 'Tests/STChunksRegression.cpp'
      - '.github/workflows/native-chunk-regression.yml'
  pull_request:
  workflow_dispatch:
jobs:
  native-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile native chunk regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            Tests/STChunksRegression.cpp Sources/Native/STChunks.cpp Sources/Native/STLZOAdapter.cpp \
            -o /tmp/stchunks-regression
      - name: Run native chunk regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/stchunks-regression
