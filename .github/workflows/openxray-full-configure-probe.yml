          echo "=== LuaJIT source feature guards ==="
          sed -n '740,785p' upstream/Externals/LuaJIT/src/lib_jit.c || true
          echo "=== LuaJIT build diagnostics ==="
          grep -n -E 'lj_cf_jit_util_traceinfo|LUAJIT_DISABLE_JIT|LJ_HASJIT' upstream/Externals/LuaJIT/src/lib_jit.c ios-build/Externals/LuaJIT-proj/lj_libdef.h ios-build/Externals/LuaJIT-proj/buildvm_arch.h 2>/dev/null | head -n 45 || true
          echo "=== First compiler errors ==="
