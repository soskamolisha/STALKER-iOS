name: Diagnose upstream OpenXRay iOS configuration
on:
  workflow_dispatch:
    inputs:
      build_launcher:
        description: Link the arm64 archive into the experimental launcher IPA
        type: boolean
        default: true
  push:
    branches: [feature/trilogy-launcher-v3]
    paths:
      - '.github/workflows/openxray-full-configure-probe.yml'
      - 'scripts/openxray_system_link_flags.py'
      - 'scripts/patch_openxray_ios_renderer.py'
      - 'scripts/openxray_ios_gles_dds.h'
      - 'scripts/patch_openxray_ios_archives.py'
      - 'scripts/prepare_ios_app_icon.py'
permissions:
  contents: read
# Only a newer explicit iPhone build supersedes a running engine build.
concurrency:
  group: openxray-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[openxray-ios]') }}
jobs:
  portable-xray-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native X-Ray bootstrap regression tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayBootstrap.cpp Sources/Native/XRayLevelCatalog.cpp Tests/XRayBootstrapTests.cpp -o /tmp/xray-bootstrap-tests
          /tmp/xray-bootstrap-tests
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelCatalog.cpp Tests/XRayLevelCatalogTests.cpp -o /tmp/xray-catalog-tests
          /tmp/xray-catalog-tests
          c++ -std=c++17 -Wall -Wextra -Werror Sources/Native/XRayLevelFiles.cpp Tests/XRayLevelFilesTests.cpp -o /tmp/xray-level-files-tests
          /tmp/xray-level-files-tests
          python3 Tests/test_openxray_archive_cli.py
  link-existing-archive:
    needs: portable-xray-regression
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[openxray-link:')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the engine build run
        id: engine
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          import re
          match = re.search(r"\[openxray-link:([0-9]+)\]", os.environ["COMMIT_MESSAGE"])
          if not match:
              raise SystemExit("Expected [openxray-link:RUN_ID]")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run={match[1]}", file=output)
          PY
      - name: Retrieve compiled iPhoneOS OpenXRay archive
        uses: actions/download-artifact@v4
        with:
          name: openxray-embedded-entry-linkage-probe
          run-id: ${{ steps.engine.outputs.run }}
          github-token: ${{ github.token }}
          path: embedded-entry/
      - name: Retrieve the separately uploaded integration archive
        if: hashFiles('embedded-entry/libOpenXRayCombinedProbe.a') == ''
        uses: actions/download-artifact@v4
        with:
          name: openxray-arm64-integration-archive
          run-id: ${{ steps.engine.outputs.run }}
          github-token: ${{ github.token }}
          path: embedded-entry/
      - name: Link the arm64 launcher and package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-openxray
          {
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            export OPENXRAY_SYSTEM_LINK_FLAGS
            OPENXRAY_SYSTEM_LINK_FLAGS="$(python3 scripts/openxray_system_link_flags.py \
              embedded-entry/xr_3da-link-arguments.txt "$(xcrun --sdk iphoneos --show-sdk-path)")"
            OPENXRAY_EXCLUDED_SOURCES=minilzo.c \
              bash scripts/build_with_openxray.sh embedded-entry/libOpenXRayCombinedProbe.a
          } 2>&1 | tee build-openxray/launcher-link.log
      - name: Upload unsigned launcher with OpenXRay
        uses: actions/upload-artifact@v4
        with:
          name: STALKERMobile-OpenXRay-unsigned-IPA
          path: build-openxray/STALKERMobile-OpenXRay-unsigned.ipa
          if-no-files-found: error
      - name: Upload launcher linkage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-launcher-linkage-log
          path: build-openxray/launcher-link.log
          if-no-files-found: ignore
  package-install-test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[openxray-install:')
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the linked launcher build
        id: launcher
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          import re
          match = re.search(r"\[openxray-install:([0-9]+)\]", os.environ["COMMIT_MESSAGE"])
          if not match:
              raise SystemExit("Expected [openxray-install:RUN_ID]")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run={match[1]}", file=output)
          PY
      - name: Retrieve the linked launcher IPA
        uses: actions/download-artifact@v4
        with:
          name: STALKERMobile-OpenXRay-unsigned-IPA
          run-id: ${{ steps.launcher.outputs.run }}
          github-token: ${{ github.token }}
      - name: Prepare and verify a separate IPA for re-signing
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/stalker-install-test"
          verify="$RUNNER_TEMP/stalker-install-verify"
          mkdir -p "$staging" "$verify"
          /usr/bin/unzip -q STALKERMobile-OpenXRay-unsigned.ipa -d "$staging"
          relative_app=Payload/STALKERiOSStarter.app
          app="$staging/$relative_app"
          executable="$app/STALKERiOSStarter"
          # The older bundle copied a source README onto the app's code level.
          rm -f "$app/README.md"
          # Use the flat iPhoneOS bundle layout. The old Resources directory
          # caused codesign to omit the root Info.plist from the code directory.
          if [ -d "$app/Resources" ]; then
            rm -f "$app/Resources/.gitkeep" "$app/Resources/AppIcon.png"
            find "$app/Resources" -maxdepth 1 -type f -exec mv -n {} "$app/" \;
            rmdir "$app/Resources"
          fi
          icon_catalog="$RUNNER_TEMP/STALKERIcons.xcassets"
          icon_info="$RUNNER_TEMP/STALKERIcons.plist"
          python3 scripts/prepare_ios_app_icon.py "$icon_catalog"
          xcrun --sdk iphoneos actool "$icon_catalog" --compile "$app" \
            --platform iphoneos --minimum-deployment-target 17.0 \
            --target-device iphone --target-device ipad --app-icon AppIcon \
            --output-partial-info-plist "$icon_info"
          python3 - "$app/Info.plist" "$icon_info" <<'PY'
          import plistlib
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          info = plistlib.loads(path.read_bytes())
          original_id = info["CFBundleIdentifier"]
          assert original_id in ("com.stalkermobile.ios", "com.stalkermobile.ios.openxray")
          legacy = original_id == "com.stalkermobile.ios"
          assert info["CFBundleSupportedPlatforms"] == ["iPhoneOS"]
          info.update(plistlib.loads(Path(sys.argv[2]).read_bytes()))
          files = info["CFBundleIcons"]["CFBundlePrimaryIcon"]["CFBundleIconFiles"]
          assert files and all(any(path.parent.glob(f"{name}*.png")) for name in files)
          info.update(CFBundleIdentifier="com.stalkermobile.ios.openxray",
                      CFBundleDisplayName="STALKER X-Ray",
                      CFBundleName="STALKER X-Ray",
                      CFBundleShortVersionString="1.0.2" if legacy else info["CFBundleShortVersionString"],
                      CFBundleVersion="3" if legacy else info["CFBundleVersion"],
                      CFBundleIconFiles=files,
                      CFBundleIconFile=files[0],
                      UIFileSharingEnabled=True,
                      LSSupportsOpeningDocumentsInPlace=True)
          path.write_bytes(plistlib.dumps(info))
          PY
          # Strip local symbols from the linked binary and deliver a clean
          # unsigned package. Verify the signing layout on an extracted copy.
          xcrun strip -x "$executable"
          if /usr/bin/codesign -d "$executable" >/dev/null 2>&1; then
            /usr/bin/codesign --remove-signature "$executable"
          fi
          xcrun lipo "$executable" -verify_arch arm64
          xcrun nm -gUj "$executable" > "$RUNNER_TEMP/openxray-install-symbols.txt"
          grep -Fxq _st_xray_embedded_run_with_resources "$RUNNER_TEMP/openxray-install-symbols.txt"
          find "$staging/Payload" -type d -exec chmod 755 {} +
          output="$GITHUB_WORKSPACE/STALKERMobile-OpenXRay-install-unsigned.ipa"
          (cd "$staging" && /usr/bin/zip -qry "$output" Payload)
          /usr/bin/unzip -tq "$output"
          /usr/bin/unzip -q "$output" -d "$verify"
          /usr/bin/codesign --force --sign - --timestamp=none \
            --identifier com.stalkermobile.ios.openxray "$verify/$relative_app"
          /usr/bin/codesign --verify --strict --verbose=2 "$verify/$relative_app"
          /usr/bin/codesign -dv --verbose=6 "$verify/$relative_app" 2>&1 | tee "$RUNNER_TEMP/openxray-install-signature.txt"
          grep -Fxq 'Identifier=com.stalkermobile.ios.openxray' "$RUNNER_TEMP/openxray-install-signature.txt"
          info_hash="$(shasum -a 256 "$verify/$relative_app/Info.plist" | awk '{print $1}')"
          grep -Eq "^[[:space:]]*-1=$info_hash$" "$RUNNER_TEMP/openxray-install-signature.txt"
      - name: Upload the OpenXRay installation test IPA
        uses: actions/upload-artifact@v4
        with:
          name: STALKERMobile-OpenXRay-install-test
          path: STALKERMobile-OpenXRay-install-unsigned.ipa
          if-no-files-found: error
  configure:
    needs: portable-xray-regression
    # An explicit marker lets the feature branch request a device build while
    # ordinary pushes continue to use only the portable regression job.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[openxray-ios]')
    runs-on: macos-15
    # Cap potentially billable cross-compilation while collecting diagnostics.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record iOS toolchain and SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-diagnostics
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-path
            cmake --version | head -n 1
            uname -m
          } | tee engine-diagnostics/toolchain.txt
      - name: Upload early-stage engine diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-toolchain-diagnostics
          path: engine-diagnostics/
          if-no-files-found: ignore
      - name: Record runner cancellation context
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p engine-diagnostics
          printf 'run_id=%s\nrun_attempt=%s\nrunner_os=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" > engine-diagnostics/runner-context.txt
      - name: Checkout upstream engine
        uses: actions/checkout@v4
        with:
          repository: OpenXRay/xray-16
          ref: d1eb5d39a81ec41a5a30383822e5706e4b13b37c
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Record exact upstream revision for reproducible iOS diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-diagnostics
          git -C upstream rev-parse HEAD | tee engine-diagnostics/openxray-upstream-sha.txt
          git -C upstream submodule status --recursive > engine-diagnostics/openxray-submodules.txt
          echo "OpenXRay upstream revision: $(cat engine-diagnostics/openxray-upstream-sha.txt)"
      - name: Record iOS compiler target triple before dependency builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-diagnostics
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          compiler="$(xcrun --sdk iphoneos --find clang++)"
          {
            printf 'sdk=%s\ncompiler=%s\n' "$sdk" "$compiler"
            "$compiler" -target arm64-apple-ios17.0 -isysroot "$sdk" -print-target-triple
          } | tee engine-diagnostics/ios-target-triple.txt
      - name: Smoke-test iPhoneOS arm64 C++ object compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-diagnostics
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          compiler="$(xcrun --sdk iphoneos --find clang++)"
          printf 'extern "C" int st_ios_arm64_probe(void) { return 16; }\n' > "$RUNNER_TEMP/st-ios-arm64-probe.cpp"
          "$compiler" -target arm64-apple-ios17.0 -isysroot "$sdk" -std=c++17 -c \
            "$RUNNER_TEMP/st-ios-arm64-probe.cpp" -o "$RUNNER_TEMP/st-ios-arm64-probe.o"
          /usr/bin/file "$RUNNER_TEMP/st-ios-arm64-probe.o" | tee engine-diagnostics/ios-arm64-object.txt
          /usr/bin/lipo "$RUNNER_TEMP/st-ios-arm64-probe.o" -verify_arch arm64
          /usr/bin/nm -gU "$RUNNER_TEMP/st-ios-arm64-probe.o" | tee engine-diagnostics/ios-arm64-symbols.txt
          grep -F _st_ios_arm64_probe engine-diagnostics/ios-arm64-symbols.txt
          echo 'iPhoneOS arm64 compiler smoke test passed.'
      - name: Build SDL2 for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git sdl2
          # SwiftUI already runs UIApplicationMain. Give the engine window
          # the same foreground scene as the launcher window.
          python3 - <<'PY'
          from pathlib import Path
          window = Path("sdl2/src/video/uikit/SDL_uikitwindow.m")
          source = window.read_text()
          anchor = "uiwindow = [[SDL_uikitwindow alloc] initWithFrame:data.uiscreen.bounds];"
          assert source.count(anchor) == 1
          window.write_text(source.replace(anchor, anchor + """
          #if TARGET_OS_IOS
                  for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                      if (scene.activationState == UISceneActivationStateForegroundActive &&
                          [scene isKindOfClass:UIWindowScene.class] &&
                          ((UIWindowScene *)scene).screen == data.uiscreen) {
                          uiwindow.windowScene = (UIWindowScene *)scene;
                          break;
                      }
                  }
          #endif
          """, 1))
          PY
          cmake -S sdl2 -B sdl2-build -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build sdl2-build --parallel 2
          cmake --install sdl2-build
      - name: Build libogg for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.5 https://github.com/xiph/ogg.git ogg
          cmake -S ogg -B ogg-build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build ogg-build --parallel 2
          cmake --install ogg-build
          test -f "$RUNNER_TEMP/ios-deps/include/ogg/ogg.h"
      - name: Build libvorbis for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git vorbis
          cmake -S vorbis -B vorbis-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ios-deps" \
            -DOGG_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DOGG_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libogg.a" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build vorbis-build --parallel 2
          cmake --install vorbis-build
          test -f "$RUNNER_TEMP/ios-deps/include/vorbis/codec.h"
      - name: Cross-compile libtheora for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config
          git clone --depth 1 https://github.com/xiph/theora.git theora
          cd theora
          ./autogen.sh
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export CFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -O2 -I$RUNNER_TEMP/ios-deps/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -L$RUNNER_TEMP/ios-deps/lib"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/ios-deps/lib/pkgconfig"
          ./configure --host=aarch64-apple-darwin --prefix="$RUNNER_TEMP/ios-deps" --enable-static --disable-shared --disable-asm --disable-examples --disable-oggtest --disable-vorbistest
          make -j2
          make install
          test -f "$RUNNER_TEMP/ios-deps/include/theora/theora.h"
      - name: Cross-compile LZO for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz -o lzo.tar.gz
          tar -xzf lzo.tar.gz
          cd lzo-2.10
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -O2"
          export LDFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0"
          ./configure --host=aarch64-apple-darwin --prefix="$RUNNER_TEMP/ios-deps" --disable-shared --enable-static
          make -j2
          make install
          test -f "$RUNNER_TEMP/ios-deps/include/lzo/lzo1x.h"
          test -f "$RUNNER_TEMP/ios-deps/lib/liblzo2.a"
      - name: Patch upstream LuaJIT iOS target detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/Externals/LuaJIT-proj/CMakeLists.txt")
          s = p.read_text()
          forced = 'set(CMAKE_OSX_SYSROOT "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk")'
          assert forced in s
          s = s.replace(forced, '# Preserve the iPhoneOS SDK selected by the parent toolchain')
          old = 'set(ENV{MACOSX_DEPLOYMENT_TARGET} ${CMAKE_OSX_DEPLOYMENT_TARGET})'
          assert old in s
          s = s.replace(old, 'if (NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\n        ' + old + '\n    endif()')
          p.write_text(s)
          PY
      - name: Adapt upstream executable install rule for iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/src/xr_3da/CMakeLists.txt")
          s = p.read_text()
          old = 'install(TARGETS xr_3da RUNTIME\n    DESTINATION "${CMAKE_INSTALL_BINDIR}"\n)'
          assert old in s
          s = s.replace(old, 'install(TARGETS xr_3da\n    RUNTIME DESTINATION "${CMAKE_INSTALL_BINDIR}"\n    BUNDLE DESTINATION "."\n)')
          p.write_text(s)
          PY
      - name: Correct OpenXRay ARM64 architecture detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/cmake/XRay.Compiler.GNULike.cmake")
          s = p.read_text()
          old = 'if (CMAKE_SYSTEM_PROCESSOR STREQUAL "aarch64" OR CMAKE_SYSTEM_PROCESSOR STREQUAL "arm64")'
          assert old in s
          s = s.replace(old, 'if (CMAKE_SYSTEM_NAME STREQUAL "iOS" OR CMAKE_OSX_ARCHITECTURES STREQUAL "arm64" OR CMAKE_SYSTEM_PROCESSOR STREQUAL "aarch64" OR CMAKE_SYSTEM_PROCESSOR STREQUAL "arm64")')
          p.write_text(s)
          PY
      - name: Build LuaJIT generator tools for macOS host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/Externals/LuaJIT-proj/CMakeLists.txt")
          s = p.read_text()
          anchor = 'set(MINILUA_BINARY_DIR "${CMAKE_CURRENT_BINARY_DIR}/HostBuildTools/minilua")'
          assert anchor in s
          host = s[s.index(anchor):]
          old = '    COMMAND ${CMAKE_COMMAND}\n        -B'
          assert host.count(old) == 2
          host = host.replace(old, '    COMMAND ${CMAKE_COMMAND} -E env --unset=SDKROOT --unset=MACOSX_DEPLOYMENT_TARGET ${CMAKE_COMMAND}\n        -B')
          host = host.replace('-DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}', '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0')
          old_build = '    COMMAND ${CMAKE_COMMAND} --build ${'
          assert host.count(old_build) == 2
          host = host.replace(old_build, '    COMMAND ${CMAKE_COMMAND} -E env --unset=SDKROOT --unset=MACOSX_DEPLOYMENT_TARGET ${CMAKE_COMMAND} --build ${')
          s = s[:s.index(anchor)] + host
          p.write_text(s)
          PY
      - name: Align LuaJIT JIT utility generation for interpreter mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/Externals/LuaJIT-proj/CMakeLists.txt")
          s = p.read_text()
          old = 'list(APPEND XCFLAGS "-DLUAJIT_DISABLE_JIT")'
          assert old in s
          s = s.replace(old, old + '\n    list(APPEND XCFLAGS "-DLUAJIT_DISABLE_JITUTIL")')
          p.write_text(s)
          PY
      - name: Propagate LuaJIT interpreter flags to host buildvm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/Externals/LuaJIT-proj/CMakeLists.txt")
          s = p.read_text()
          old = 'set(HOST_ACFLAGS "${CMAKE_C_FLAGS} ${CCOPTIONS} ${TARGET_ARCH}")'
          assert old in s
          new = old + '\nif (LUAJIT_DISABLE_JIT)\n    string(APPEND HOST_ACFLAGS " -DLUAJIT_DISABLE_JIT -DLUAJIT_DISABLE_JITUTIL")\nendif()'
          p.write_text(s.replace(old, new))
          PY
      - name: Disable unsupported external URL shell launch on iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/src/xrGame/login_manager.cpp")
          s = p.read_text()
          old = '#else\n    std::string command = "xdg-open " + std::string{url};\n    std::ignore = system(command.c_str());\n#endif'
          assert old in s
          new = '#elif defined(XR_PLATFORM_IOS) || defined(__APPLE__) && defined(TARGET_OS_IPHONE)\n    (void)url; // External URL opening requires an iOS UIApplication bridge.\n#else\n    std::string command = "xdg-open " + std::string{url};\n    std::ignore = system(command.c_str());\n#endif'
          p.write_text(s.replace(old, new))
          PY
      - name: Disable unsupported multiplayer map shell launch on iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/src/xrGame/MainMenu.cpp")
          s = p.read_text()
          old = '#else\n    std::string command = "xdg-open " + std::string{url};\n    std::ignore = system(command.c_str());\n#endif'
          assert old in s
          new = '#elif defined(XR_PLATFORM_IOS) || defined(__APPLE__) && defined(TARGET_OS_IPHONE)\n    (void)url; // Opening external links needs an iOS platform bridge.\n#else\n    std::string command = "xdg-open " + std::string{url};\n    std::ignore = system(command.c_str());\n#endif'
          p.write_text(s.replace(old, new))
          PY
      - name: Add experimental C ABI for embedded X-Ray runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          engine_header = Path("upstream/src/xrEngine/x_ray.h")
          engine_source = Path("upstream/src/xrEngine/x_ray.cpp")
          signature = "GameModule* game, const std::array<RendererModule*, 2>& modules)"
          for path, suffix in [(engine_header, " = nullptr"), (engine_source, "")]:
              source = path.read_text()
              constructor = "CApplication(pcstr commandLine, " + signature
              assert source.count(constructor) == 1, f"Unexpected constructor in {path}"
              updated = constructor[:-1] + ", pcstr filesystemConfig" + suffix + ")"
              source = source.replace(constructor, updated, 1)
              if path == engine_source:
                  parser = "if (strstr(commandLine, fsltx))"
                  initialize = '*fsgame ? fsgame : nullptr'
                  assert source.count(parser) == source.count(initialize) == 1
                  source = source.replace(parser, "if (!filesystemConfig && strstr(commandLine, fsltx))", 1)
                  source = source.replace(initialize, "filesystemConfig ? filesystemConfig : (*fsgame ? fsgame : nullptr)", 1)
              path.write_text(source)

          p = Path("upstream/src/xr_3da/entry_point.cpp")
          s = p.read_text()
          s = '#include <fcntl.h>\n#include <unistd.h>\n#include <cstdio>\n#include <sys/stat.h>\n#include <string>\n#include <pthread.h>\n#include <SDL_main.h>\n#include <SDL_system.h>\n' + s.replace('#include "stdafx.h"', '#include "stdafx.h"\n#include "xrCore/log.h"', 1)
          anchor = "#if defined(XR_PLATFORM_WINDOWS)\nint StackoverflowFilter"
          assert s.count(anchor) == 1, "Upstream entry point layout changed"
          engine, standalone_main = s.split(anchor, 1)
          entry = "int entry_point(pcstr commandLine)"
          construct = "CApplication app{ commandLine, game, s_render_modules };"
          assert engine.count(entry) == engine.count(construct) == 1
          engine = engine.replace(entry, "int entry_point(pcstr commandLine, pcstr filesystemConfig = nullptr)", 1)
          engine = engine.replace(construct, "CApplication app{ commandLine, game, s_render_modules, filesystemConfig };", 1)
          bridge = "\n".join([
              'static int run_embedded(pcstr commandLine, pcstr filesystemConfig = nullptr)',
              '{',
              '    if (!pthread_main_np()) return -10;',
              '    SDL_SetMainReady();',
              '    SDL_iPhoneSetEventPump(SDL_TRUE);',
              '    struct ResetEventPump {',
              '        ~ResetEventPump() { SDL_iPhoneSetEventPump(SDL_FALSE); }',
              '    } resetEventPump;',
              '    return entry_point(commandLine, filesystemConfig);',
              '}',
              '',
              'extern "C" __attribute__((used, visibility("default"), retain)) int st_xray_embedded_run(const char* command_line)',
              '{',
              '    return run_embedded(command_line ? command_line : "");',
              '}',
              '',
              '// Pass the validated config to xrCore without serializing it as a flag.',
              'extern "C" __attribute__((used, visibility("default"), retain)) int st_xray_embedded_run_with_resources(const char* command_line, const char* resource_root)',
              '{',
              "    if (!resource_root || resource_root[0] != '/') return -6;",
              '    const std::string root(resource_root);',
              "    if (root.size() > 1 && root.back() == '/') return -6;",
              '    struct stat root_info {};',
              '    if (lstat(root.c_str(), &root_info) != 0 || !S_ISDIR(root_info.st_mode)) return -6;',
              '    const std::string config = root + "/fsgame.ltx";',
              '    if (config.size() >= sizeof(string_path)) return -6;',
              '    struct stat info {};',
              '    if (lstat(config.c_str(), &info) != 0 || !S_ISREG(info.st_mode) || info.st_size <= 0) return -7;',
              '    const std::string journalPath = root + "/xray-launch.log";',
              '    const int fd = open(journalPath.c_str(), O_WRONLY | O_CREAT | O_TRUNC | O_NOFOLLOW | O_NONBLOCK | O_CLOEXEC, 0600);',
              '    FILE* journal = fd >= 0 ? fdopen(fd, "w") : nullptr;',
              '    if (fd >= 0 && !journal) close(fd);',
              '    struct LaunchLog {',
              '        FILE* file;',
              '        LogCallback previous;',
              '        ~LaunchLog() { if (file) { SetLogCB(previous); fclose(file); } }',
              '    } log{journal, nullptr};',
              '    if (journal) {',
              '        setvbuf(journal, nullptr, _IONBF, 0);',
              '        fputs("Starting embedded OpenXRay\\n", journal);',
              '        log.previous = SetLogCB(LogCallback([](void* context, const char* message) {',
              '            auto* file = static_cast<FILE*>(context);',
              '            if (ftell(file) < 1024 * 1024) fprintf(file, "%s\\n", message);',
              '        }, journal));',
              '    }',
              '    const int result = run_embedded(command_line ? command_line : "", config.c_str());',
              '    if (journal) fprintf(journal, "OpenXRay finished with code %d\\n", result);',
              '    return result;',
              '}',
              '',
              ''
          ])
          # Keep the standalone entry separate so the engine archive can be
          # linked by an app that already defines its own main.
          p.write_text(engine + bridge)
          p.with_name("standalone_main.cpp").write_text(
              '#include "stdafx.h"\n#include <cstdlib>\n\n'
              'int entry_point(pcstr commandLine, pcstr filesystemConfig = nullptr);\n\n' + anchor + standalone_main
          )
          cmake = p.with_name("CMakeLists.txt")
          targets = cmake.read_text()
          source = "    entry_point.cpp\n"
          assert targets.count(source) == 1, "Upstream executable source list changed"
          cmake.write_text(targets.replace(source, source + "    standalone_main.cpp\n", 1))
          patched = p.read_text()
          assert patched.count('int st_xray_embedded_run(') == 1
          assert 'run_embedded(command_line ? command_line : "", config.c_str());' in patched
          print("Experimental X-Ray C ABI inserted and verified before CMake configuration")

          PY
      - name: Fix legacy archive decoding for iPhoneOS
        run: python3 scripts/patch_openxray_ios_archives.py upstream
      - name: Adapt the OpenXRay renderer for SDL OpenGL ES on iPhoneOS
        run: python3 scripts/patch_openxray_ios_renderer.py upstream
      - name: Attempt iPhoneOS arm64 CMake configuration
        shell: bash
        run: |
          set +e
          echo "Upstream revision: $(git -C upstream rev-parse HEAD)" > ios-configure.log
          cmake -S upstream -B ios-build \
            -DLUAJIT_DISABLE_JIT=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ios-deps" \
            -DSDL2_DIR="$RUNNER_TEMP/ios-deps/lib/cmake/SDL2" \
            -DOGG_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DOGG_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libogg.a" \
            -DVORBIS_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DVORBIS_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libvorbis.a" \
            -DVORBISFILE_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libvorbisfile.a" \
            -DTHEORA_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DTHEORA_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libtheora.a" \
            -DLZO_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DLZO_LIBRARY="$RUNNER_TEMP/ios-deps/lib/liblzo2.a" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH >> ios-configure.log 2>&1
          result=$?
          echo "$result" > ios-configure-exit-code.txt
          cat ios-configure.log
          exit 0
      - name: Attempt native engine compilation when configuration succeeds
        shell: bash
        run: |
          set +e
          if [ "$(cat ios-configure-exit-code.txt 2>/dev/null)" = 0 ]; then
            cmake --build ios-build --parallel 2 > ios-build-attempt.log 2>&1
            result=$?
            echo "$result" > ios-build-exit-code.txt
          else
            echo "CMake configuration failed; engine build skipped." > ios-build-attempt.log
            echo skipped > ios-build-exit-code.txt
          fi
          echo "=== LuaJIT buildvm generator flags ==="
          grep -n -E 'HOST_ACFLAGS|LUAJIT_DISABLE_JIT|LUAJIT_DISABLE_JITUTIL|CMAKE_C_FLAGS' ios-build/Externals/LuaJIT-proj/HostBuildTools/buildvm/CMakeCache.txt ios-build/Externals/LuaJIT-proj/HostBuildTools/buildvm/CMakeFiles/buildvm.dir/flags.make ios-build/Externals/LuaJIT-proj/CMakeFiles/xrLuaJIT.dir/flags.make 2>/dev/null | head -n 65 || true
          echo "=== LuaJIT source feature guards ==="
          sed -n '740,785p' upstream/Externals/LuaJIT/src/lib_jit.c || true
          echo "=== LuaJIT build diagnostics ==="
          grep -n -E 'lj_cf_jit_util_traceinfo|LUAJIT_DISABLE_JIT|LJ_HASJIT' upstream/Externals/LuaJIT/src/lib_jit.c ios-build/Externals/LuaJIT-proj/lj_libdef.h ios-build/Externals/LuaJIT-proj/buildvm_arch.h 2>/dev/null | head -n 45 || true
          echo "=== First compiler errors ==="
          grep -n -m 12 -B 7 -A 3 'error:' ios-build-attempt.log || true
          tail -n 120 ios-build-attempt.log
      - name: Report and annotate errors
        if: always()
        shell: bash
        run: |
          config="$(cat ios-configure-exit-code.txt 2>/dev/null || echo unavailable)"
          build="$(cat ios-build-exit-code.txt 2>/dev/null || echo unavailable)"
          {
            echo "### OpenXRay iPhoneOS arm64"
            echo "Configure: $config; compile: $build"
            echo '~~~text'
            grep -Ei 'fatal error:|error:|CMake Error|FAILED:|undefined symbols|ld: error' ios-configure.log ios-build-attempt.log 2>/dev/null | head -n 35 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          (grep -Ei 'fatal error:|error:|CMake Error|FAILED:|undefined symbols|ld: error' ios-configure.log ios-build-attempt.log 2>/dev/null || true) | head -n 10 | while IFS= read -r line; do
            echo "::error title=OpenXRay iOS diagnostic::$line"
          done
          true
      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-cmake-diagnostics
          path: |
            ios-configure.log
            ios-configure-exit-code.txt
            ios-build-exit-code.txt
            ios-build-attempt.log
            ios-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
      - name: Verify native X-Ray entry point symbol
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then exit 0; fi
          binary="upstream/bin/Release/xr_3da.app/xr_3da"
          /usr/bin/nm -gU "$binary" | grep -F '_main'
          if ! /usr/bin/nm -gU "$binary" | grep -F '_st_xray_embedded_run'; then
            echo "::error::Embedded X-Ray C ABI symbol missing from arm64 executable"
            exit 1
          fi
          echo "Entry-point audit complete."
      - name: Package embedded X-Ray entry-point object for linkage research
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then exit 0; fi
          mkdir -p embedded-entry
          find ios-build -type f \( -name 'entry_point.cpp.o' -o -name 'entry_point.cpp.obj' \) -print > embedded-entry/candidates.txt
          if [ ! -s embedded-entry/candidates.txt ]; then
            echo "::error::Compiled X-Ray entry_point object not found"
            exit 1
          fi
          while IFS= read -r candidate; do
            if /usr/bin/nm -gU "$candidate" 2>/dev/null | grep -q '_st_xray_embedded_run'; then
              cp "$candidate" embedded-entry/entry_point.o
              break
            fi
          done < embedded-entry/candidates.txt
          if [ ! -f embedded-entry/entry_point.o ]; then
            echo "::error::No compiled entry-point object defines the embedded C ABI"
            exit 1
          fi
          /usr/bin/file embedded-entry/entry_point.o | tee embedded-entry/architecture.txt
          if grep -q "LLVM bitcode" embedded-entry/architecture.txt; then
            echo "::notice::Entry-point object is LLVM bitcode (LTO); linking requires compatible Apple Clang LTO settings."
          fi
          /usr/bin/nm -gU embedded-entry/entry_point.o > embedded-entry/exported-symbols.txt
          /usr/bin/nm -u embedded-entry/entry_point.o > embedded-entry/undefined-symbols.txt
          # Preserve the actual engine link command and its static library inputs.
          # The entry-point archive is only a probe; a future embedded target must
          # link the full dependency closure rather than this object alone.
          find ios-build -name link.txt -path '*xr_3da*' -print -exec sh -c 'cat "$1"; echo' sh {} \; > embedded-entry/engine-link-commands.txt
          # This job uses CMake's default Unix Makefiles generator, not Xcode.
          # Capture every generated link.txt so target-specific engine link
          # commands can be located even if the directory name differs.
          find ios-build -type f -name link.txt -print | sort > embedded-entry/all-link-command-paths.txt
          while IFS= read -r linkfile; do
            printf '\n=== %s ===\n' "$linkfile"
            cat "$linkfile"
          done < embedded-entry/all-link-command-paths.txt > embedded-entry/all-link-commands.txt
          echo "CMake link command files: $(wc -l < embedded-entry/all-link-command-paths.txt)"
          # Record the complete native executable link command, including
          # third-party libraries and linker flags, without guessing paths.
          grep -E '/xr_3da/|/xr_3da\\.dir/|/xrEngine/' embedded-entry/all-link-command-paths.txt > embedded-entry/engine-link-candidates.txt || true
          echo "Engine-related link command paths: $(wc -l < embedded-entry/engine-link-candidates.txt)"
          while IFS= read -r linkfile; do
            printf '\n=== %s ===\n' "$linkfile"
            cat "$linkfile"
          done < embedded-entry/engine-link-candidates.txt > embedded-entry/engine-link-command-expanded.txt
          if [ ! -s embedded-entry/engine-link-command-expanded.txt ]; then
            echo "::error::No full engine link command found."
            exit 1
          fi
          echo "Full engine link command captured ($(wc -c < embedded-entry/engine-link-command-expanded.txt) bytes)."
          # Expose the actual command and resolve @response-file references
          # instead of treating a zero-archive count as a missing dependency.
          echo "=== Engine linker invocation ==="
          cat embedded-entry/engine-link-command-expanded.txt
          echo "=== CMake target link metadata ==="
          find ios-build -type f \( -name flags.make -o -name linkLibs.rsp -o -name objects1.rsp \) -path '*xr_3da*' -print -exec sh -c 'cat "$1"; echo' sh {} \; > embedded-entry/engine-link-target-metadata.txt
          head -c 12000 embedded-entry/engine-link-target-metadata.txt || true
          # Parse only xr_3da's executable link command; xrEngine's
          # archive creation is a separate command, not executable linkage.
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          # CMake executes link.txt from the target build directory, not CMakeFiles/*.dir.
          root = Path("ios-build/src/xr_3da")
          link = root / "CMakeFiles/xr_3da.dir/link.txt"
          if not link.is_file():
              raise SystemExit(f"Missing executable link command: {link}")
          command = link.read_text().strip()
          tokens = shlex.split(command)
          expanded = []
          for token in tokens:
              if token.startswith("@"):
                  rsp = root / token[1:]
                  if not rsp.is_file():
                      raise SystemExit(f"Missing linker response file: {rsp}")
                  expanded.extend(shlex.split(rsp.read_text()))
              else:
                  expanded.append(token)
          archives = [t for t in expanded if t.endswith(".a")]
          libraries = [t for t in expanded if t.endswith((".a", ".dylib", ".tbd")) or t.startswith(("-l", "-framework", "-weak_framework", "@"))]
          out = Path("embedded-entry")
          (out / "xr_3da-link-command.txt").write_text(command + chr(10))
          (out / "xr_3da-link-arguments.txt").write_text(chr(10).join(expanded) + chr(10))
          (out / "engine-link-static-archives.txt").write_text(chr(10).join(archives) + chr(10))
          (out / "engine-link-library-inputs.txt").write_text(chr(10).join(libraries) + chr(10))
          (out / "engine-link-token-count.txt").write_text(str(len(expanded)) + chr(10))
          print(f"xr_3da executable link: {len(expanded)} tokens, {len(archives)} static archives, {len(libraries)} library flags")
          if not archives:
              raise SystemExit("No static engine archives in xr_3da executable link command")
          # Resolve the actual archive closure relative to the executable's
          # CMake working directory. Fail if any archive is missing; this
          # prevents generating a misleading embedding manifest.
          resolved = []
          missing = []
          for item in archives:
              archive = Path(item)
              if not archive.is_absolute():
                  archive = root / archive
              archive = archive.resolve()
              if archive.is_file():
                  resolved.append(str(archive))
              else:
                  missing.append(str(archive))
          (out / "xr_3da-resolved-static-archives.txt").write_text(chr(10).join(resolved) + chr(10))
          print(f"Resolved engine archives: {len(resolved)}/{len(archives)}")
          if missing:
              raise SystemExit("Missing engine archives: " + ", ".join(missing))
          # A linkable engine archive must preserve the whole native object
          # closure. Start with a reproducible archive inventory; do not
          # mistake a single entry-point object for a complete engine.
          unique = list(dict.fromkeys(resolved))
          (out / "xr_3da-unique-static-archives.txt").write_text(chr(10).join(unique) + chr(10))
          sizes = [(Path(p).name, Path(p).stat().st_size) for p in unique]
          (out / "xr_3da-archive-sizes.tsv").write_text(
              chr(10).join(f"{name}\\t{size}" for name, size in sizes) + chr(10)
          )
          print(f"Unique engine archives: {len(unique)}; total archive bytes: {sum(size for _, size in sizes)}")
          PY
          # Real native archive merge probe. This validates that the
          # OpenXRay dependency closure can be packaged for static linkage;
          # it does not claim the UIKit lifecycle or SwiftUI integration works.
          engine_archives=()
          while IFS= read -r archive; do
            [ -n "$archive" ] && engine_archives+=("$archive")
          done < embedded-entry/xr_3da-unique-static-archives.txt
          # Include the C ABI entry-point object in the full arm64 engine archive.
          test -s embedded-entry/entry_point.o
          /usr/bin/libtool -static -o embedded-entry/libOpenXRayCombinedProbe.a embedded-entry/entry_point.o "${engine_archives[@]}"
          /usr/bin/nm -gU embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-entry-symbols.txt 2>/dev/null
          if ! grep -Eq '[[:space:]]_st_xray_embedded_run_with_resources$' embedded-entry/combined-entry-symbols.txt; then
            echo "Missing embedded X-Ray C ABI entry point"
            exit 1
          fi
          if grep -Eq '[[:space:]]_main$' embedded-entry/combined-entry-symbols.txt; then
            echo "Standalone main is present in the engine archive"
            exit 1
          fi
          rm embedded-entry/combined-entry-symbols.txt
          /usr/bin/file embedded-entry/libOpenXRayCombinedProbe.a | tee embedded-entry/combined-archive-type.txt
          /usr/bin/ar -t embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-members.txt
          echo "Combined archive members: $(wc -l < embedded-entry/combined-archive-members.txt)"
          /usr/bin/lipo -info embedded-entry/libOpenXRayCombinedProbe.a | tee embedded-entry/combined-archive-architecture.txt
          if ! grep -q 'arm64' embedded-entry/combined-archive-architecture.txt; then
            echo "::error::Combined OpenXRay archive does not contain arm64"
            exit 1
          fi
          # Validate that this is an engine archive, not merely a collection
          # of unrelated dependencies. The entry-point wrapper remains separate.
          /usr/bin/nm -gU embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-exports.txt 2> embedded-entry/combined-archive-nm-errors.txt
          python3 - <<'PY'
          from pathlib import Path
          symbols = Path("embedded-entry/combined-archive-exports.txt").read_text(errors="replace")
          families = {
              "xrCore": ("xrCore", "xrDebug"),
              "xrEngine": ("CEngine", "CDevice"),
              "xrGame": ("CLevel", "CActor"),
          }
          results = {name: any(token in symbols for token in names) for name, names in families.items()}
          Path("embedded-entry/combined-archive-engine-symbol-audit.txt").write_text(
              chr(10).join(f"{name}: {'present' if present else 'not detected'}" for name, present in results.items()) + chr(10)
          )
          print("Combined archive engine symbol audit:", results)
          if not any(results.values()):
              raise SystemExit("No recognizable OpenXRay engine exports in merged archive")
          PY
          rm embedded-entry/combined-archive-exports.txt
          # Keep diagnostic artifacts lightweight; the merged archive is
          # generated and inspected here, but not uploaded as a huge CI artifact.
          /usr/bin/stat -f '%z' embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-size-bytes.txt
          # Probe an actual iOS arm64 linker invocation against the merged
          # archive. This intentionally does not claim a runnable UIKit app.
          # The symbol is pulled from the archive by an undefined reference.
          # Bound this experimental link probe so it cannot consume the
          # entire macOS runner budget and cancel the useful engine build.
          python3 - <<'PY'
          import pathlib
          import subprocess
          sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-path"], text=True
          ).strip()
          cmd = [
              "xcrun", "--sdk", "iphoneos", "clang++",
              "-arch", "arm64", "-target", "arm64-apple-ios17.0",
              "-isysroot", sdk, "-Wl,-r", "-Wl,-u,_st_xray_embedded_run",
              "embedded-entry/libOpenXRayCombinedProbe.a",
              "-o", "embedded-entry/engine-partial-link.o",
          ]
          log = pathlib.Path("embedded-entry/engine-partial-link.log")
          try:
              with log.open("wb") as output:
                  result = subprocess.run(
                      cmd, stdout=output, stderr=subprocess.STDOUT, timeout=180,
                      check=False,
                  )
              status = result.returncode
          except subprocess.TimeoutExpired:
              status = 124
              with log.open("ab") as output:
                  output.write(b"\\nLink probe timed out after 180 seconds\\n")
          pathlib.Path("embedded-entry/engine-partial-link-exit-code.txt").write_text(
              str(status) + chr(10)
          )
          print("Partial engine link exit code:", status)
          PY
          partial_link_status="$(cat embedded-entry/engine-partial-link-exit-code.txt)"
          if [ "$partial_link_status" -eq 0 ]; then
            test -s embedded-entry/engine-partial-link.o
            /usr/bin/file embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-type.txt
            /usr/bin/nm -gU embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-symbols.txt
            if ! grep -q '_st_xray_embedded_run' embedded-entry/engine-partial-link-symbols.txt; then
              echo "::error::Partial link succeeded but embedded X-Ray entry point is missing"
              exit 1
            fi
            # A relocatable link can still contain undefined references.
            # Preserve the evidence before deleting the large probe object.
            /usr/bin/nm -u embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-undefined-symbols.txt
            grep -c ' U ' embedded-entry/engine-partial-link-undefined-symbols.txt > embedded-entry/engine-partial-link-unresolved-count.txt || true
            echo "Unresolved references after partial link: $(cat embedded-entry/engine-partial-link-unresolved-count.txt)"
            rm embedded-entry/engine-partial-link-symbols.txt
            rm embedded-entry/engine-partial-link.o
          else
            echo "::warning::Partial engine link diagnostic exited with code $partial_link_status. The final Xcode link is authoritative."
            tail -n 35 embedded-entry/engine-partial-link.log
          fi
          # Keep the compiled engine archive as a reusable integration input.
          # This is NOT a complete, independently linkable iOS game runtime.
          mkdir -p engine-integration
          mv embedded-entry/libOpenXRayCombinedProbe.a engine-integration/libOpenXRayCombinedProbe.a
          /usr/bin/shasum -a 256 engine-integration/libOpenXRayCombinedProbe.a > engine-integration/SHA256SUMS
          # Require the actual embedded entry symbol before publishing a
          # candidate for in-process launcher integration.
          /usr/bin/nm -gU engine-integration/libOpenXRayCombinedProbe.a > engine-integration/exported-symbols.txt
          if ! grep -q '_st_xray_embedded_run' engine-integration/exported-symbols.txt; then
            echo "::error::Missing embedded OpenXRay entry point"
            exit 1
          fi
          # Reject archives without the resource-aware ABI required by the launcher.
          # A legacy-only archive cannot launch imported game assets.
          python3 scripts/verify_openxray_archive.py --require-resources engine-integration/libOpenXRayCombinedProbe.a
          /usr/bin/lipo engine-integration/libOpenXRayCombinedProbe.a -verify_arch arm64
          /usr/bin/nm -u engine-integration/libOpenXRayCombinedProbe.a > engine-integration/undefined-symbols.txt
          printf 'entry_point=st_xray_embedded_run\\nresource_aware_entry=present\\narchitecture=arm64\\nlink_status=unverified\\nlauncher_integration=no\\n' > engine-integration/integration-status.txt
          rm engine-integration/exported-symbols.txt
          printf '%s\n' 'Experimental OpenXRay arm64 archive for in-process iOS linkage.' 'The resource-aware ABI passes the imported filesystem config to xrCore.' 'Device rendering and gameplay remain unverified.' > engine-integration/README.txt
          if [ ! -s embedded-entry/all-link-command-paths.txt ]; then
            echo "::error::No CMake link.txt files found; cannot reconstruct engine linkage."
            exit 1
          fi
          grep '^CMAKE_GENERATOR:' ios-build/CMakeCache.txt > embedded-entry/cmake-generator.txt || true
          # Xcode generators commonly use LinkFileList instead of CMake link.txt.
          find ios-build -type f \( -name '*.LinkFileList' -o -name '*-LinkFileList' \) -print > embedded-entry/xcode-link-filelists.txt
          while IFS= read -r list; do
            printf '\n=== %s ===\n' "$list"
            cat "$list"
          done < embedded-entry/xcode-link-filelists.txt > embedded-entry/xcode-link-inputs.txt
          # CMake's Xcode generator writes the final linker invocation to
          # build logs; retain it alongside LinkFileList for dependency analysis.
          if [ -f ios-build-attempt.log ]; then
            grep -E '(^|[[:space:]])(Ld|Libtool|clang\+\+|/usr/bin/clang\+\+)([[:space:]]|$)' ios-build-attempt.log > embedded-entry/linker-log-excerpts.txt || true
          fi
          echo "Xcode LinkFileList files: $(wc -l < embedded-entry/xcode-link-filelists.txt)"
          echo "Xcode linker inputs (bytes): $(wc -c < embedded-entry/xcode-link-inputs.txt)"
          find ios-build -type f -name '*.a' -print | sort > embedded-entry/static-library-candidates.txt
          echo "Static library candidates: $(wc -l < embedded-entry/static-library-candidates.txt)"
          if [ ! -s embedded-entry/engine-link-commands.txt ]; then
            echo "::warning::No xr_3da link.txt found; Xcode generator may store link instructions elsewhere."
          fi
          printf "Undefined symbols in entry-point object: " | tee embedded-entry/linkage-summary.txt
          wc -l < embedded-entry/undefined-symbols.txt | tee -a embedded-entry/linkage-summary.txt
          echo "An entry-point archive alone cannot be linked as a complete X-Ray engine." | tee -a embedded-entry/linkage-summary.txt
          /usr/bin/libtool -static -o embedded-entry/libXRayEntryPointProbe.a embedded-entry/entry_point.o
          /usr/bin/ar -t embedded-entry/libXRayEntryPointProbe.a
          echo "This archive contains only an entry-point object, NOT a linkable full engine."
      - name: Upload reusable arm64 engine integration archive
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-arm64-integration-archive
          path: engine-integration/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Link OpenXRay into the arm64 launcher and package an unsigned IPA
        if: github.event_name == 'push' || inputs.build_launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-openxray
          {
            if [[ ! -s engine-integration/libOpenXRayCombinedProbe.a ]]; then
              echo "::error::OpenXRay did not produce a verified arm64 archive for the launcher"
              exit 1
            fi
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            export OPENXRAY_SYSTEM_LINK_FLAGS
            OPENXRAY_SYSTEM_LINK_FLAGS="$(python3 scripts/openxray_system_link_flags.py \
              embedded-entry/xr_3da-link-arguments.txt "$(xcrun --sdk iphoneos --show-sdk-path)")"
            echo "OpenXRay system link flags: $OPENXRAY_SYSTEM_LINK_FLAGS"
            # The OpenXRay archive already contains the full liblzo2 codec.
            OPENXRAY_EXCLUDED_SOURCES=minilzo.c \
              bash scripts/build_with_openxray.sh engine-integration/libOpenXRayCombinedProbe.a
          } 2>&1 | tee build-openxray/launcher-link.log
      - name: Upload unsigned launcher with the experimental OpenXRay build
        if: github.event_name == 'push' || inputs.build_launcher
        uses: actions/upload-artifact@v4
        with:
          name: STALKERMobile-OpenXRay-unsigned-IPA
          path: build-openxray/STALKERMobile-OpenXRay-unsigned.ipa
          if-no-files-found: error
      - name: Upload launcher linkage log
        if: always() && (github.event_name == 'push' || inputs.build_launcher)
        uses: actions/upload-artifact@v4
        with:
          name: openxray-launcher-linkage-log
          path: build-openxray/launcher-link.log
          if-no-files-found: ignore
      - name: Upload embedded entry-point linkage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-embedded-entry-linkage-probe
          path: embedded-entry/
          if-no-files-found: ignore
          retention-days: 14
      - name: Inspect engine-to-launcher integration interfaces
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then
            echo "Engine not built; integration audit skipped."
            exit 0
          fi
          mkdir -p integration-audit
          {
            echo "OpenXRay iOS engine integration audit"
            echo "Engine binary:"
            /usr/bin/file upstream/bin/Release/xr_3da.app/xr_3da
            echo
            echo "Executable entry points:"
            /usr/bin/nm -gU upstream/bin/Release/xr_3da.app/xr_3da 2>/dev/null | grep -E '(_main$|SDL_main|UIApplicationMain|xrEngine)' | head -n 30 || true
            echo
            echo "Build targets and link commands:"
            find ios-build -name link.txt -path '*xr_3da*' -print -exec sh -c 'head -c 20000 "$1"; echo' sh {} \; || true
            echo
            echo "Existing launcher integration:"
            echo "SwiftUI currently instantiates UnavailableEngine; no native X-Ray runtime linkage."
            echo "The executable cannot be launched as an iOS child process."
            echo "Next engineering task: expose an embeddable runtime entry point and bind it to UIKit/SDL lifecycle."
          } > integration-audit/report.txt
          cat integration-audit/report.txt | head -n 35
      - name: Upload engine integration audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-launcher-integration-audit
          path: integration-audit/report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Package compiled iOS X-Ray engine bundle
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then
            echo "Engine compilation unsuccessful; no engine bundle will be published."
            exit 0
          fi
          bundle="upstream/bin/Release/xr_3da.app"
          test -f "$bundle/xr_3da"
          mkdir -p engine-package
          cp -R "$bundle" engine-package/
          plist="engine-package/xr_3da.app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stalkermobile.openxray.engine' "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stalkermobile.openxray.engine' "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName STALKER X-Ray Test' "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string STALKER X-Ray Test' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
          /usr/bin/file engine-package/xr_3da.app/xr_3da
          /usr/bin/lipo -info engine-package/xr_3da.app/xr_3da
          echo "=== App bundle metadata ==="
          if [ -f engine-package/xr_3da.app/Info.plist ]; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' engine-package/xr_3da.app/Info.plist
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' engine-package/xr_3da.app/Info.plist
            /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' engine-package/xr_3da.app/Info.plist
          else
            echo "::warning::Missing Info.plist; compiled bundle is not yet installable."
          fi
          echo "=== Code signature ==="
          /usr/bin/codesign --verify --verbose=2 engine-package/xr_3da.app || true
          echo "=== Runtime linkage ==="
          /usr/bin/otool -L engine-package/xr_3da.app/xr_3da | tee engine-package/dylib-dependencies.txt
          echo "=== Engine artifact manifest ==="
          /usr/bin/shasum -a 256 engine-package/xr_3da.app/xr_3da | tee engine-package/sha256.txt
          echo "Compiled engine bundle packaged; this is not a signed or launch-tested IPA."
      - name: Package unsigned engine test IPA
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f engine-package/xr_3da.app/xr_3da ]; then
            echo "Engine binary missing; unsigned engine IPA cannot be packaged."
            exit 0
          fi
          mkdir -p ipa-staging/Payload
          cp -R engine-package/xr_3da.app ipa-staging/Payload/
          (cd ipa-staging && /usr/bin/zip -qry ../openxray-engine-unsigned-test.ipa Payload)
          /usr/bin/unzip -t openxray-engine-unsigned-test.ipa | tail -n 2
          echo "Unsigned engine-only IPA created for packaging diagnostics; not signed, not integrated into launcher, not gameplay-tested."
      - name: Upload unsigned engine test IPA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-engine-unsigned-test-ipa
          path: openxray-engine-unsigned-test.ipa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload unsigned iOS X-Ray engine bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-arm64-unsigned-app
          path: engine-package/xr_3da.app/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce real iOS engine compilation status
        if: always()
        shell: bash
        run: |
          config="$(cat ios-configure-exit-code.txt 2>/dev/null || echo unavailable)"
          build="$(cat ios-build-exit-code.txt 2>/dev/null || echo unavailable)"
          if [ "$config" != 0 ] || [ "$build" != 0 ]; then
            echo "::error::OpenXRay iOS engine not compiled (configure=$config, build=$build)."
            exit 1
          fi
