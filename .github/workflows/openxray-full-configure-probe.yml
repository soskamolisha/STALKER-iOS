name: Diagnose upstream OpenXRay iOS configuration
on:
  workflow_dispatch:
  push:
    branches: [feature/trilogy-launcher-v3]
    paths: [.github/workflows/openxray-full-configure-probe.yml]
permissions:
  contents: read
jobs:
  configure:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout upstream engine
        uses: actions/checkout@v4
        with:
          repository: OpenXRay/xray-16
          ref: dev
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Build SDL2 for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git sdl2
          cmake -S sdl2 -B sdl2-build -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build sdl2-build --parallel 2
          cmake --install sdl2-build
      - name: Build libogg for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.5 https://github.com/xiph/ogg.git ogg
          cmake -S ogg -B ogg-build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build ogg-build --parallel 2
          cmake --install ogg-build
          test -f "$RUNNER_TEMP/ios-deps/include/ogg/ogg.h"
      - name: Build libvorbis for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git vorbis
          cmake -S vorbis -B vorbis-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ios-deps" \
            -DOGG_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DOGG_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libogg.a" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ios-deps"
          cmake --build vorbis-build --parallel 2
          cmake --install vorbis-build
          test -f "$RUNNER_TEMP/ios-deps/include/vorbis/codec.h"
      - name: Cross-compile libtheora for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config
          git clone --depth 1 https://github.com/xiph/theora.git theora
          cd theora
          ./autogen.sh
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export CFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -O2 -I$RUNNER_TEMP/ios-deps/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -L$RUNNER_TEMP/ios-deps/lib"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/ios-deps/lib/pkgconfig"
          ./configure --host=aarch64-apple-darwin --prefix="$RUNNER_TEMP/ios-deps" --enable-static --disable-shared --disable-asm --disable-examples --disable-oggtest --disable-vorbistest
          make -j2
          make install
          test -f "$RUNNER_TEMP/ios-deps/include/theora/theora.h"
      - name: Cross-compile LZO for iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz -o lzo.tar.gz
          tar -xzf lzo.tar.gz
          cd lzo-2.10
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0 -O2"
          export LDFLAGS="-arch arm64 -isysroot $sdk -miphoneos-version-min=17.0"
          ./configure --host=aarch64-apple-darwin --prefix="$RUNNER_TEMP/ios-deps" --disable-shared --enable-static
          make -j2
          make install
          test -f "$RUNNER_TEMP/ios-deps/include/lzo/lzo1x.h"
          test -f "$RUNNER_TEMP/ios-deps/lib/liblzo2.a"
      - name: Patch upstream LuaJIT iOS target detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/Externals/LuaJIT-proj/CMakeLists.txt")
          s = p.read_text()
          forced = 'set(CMAKE_OSX_SYSROOT "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk")'
          assert forced in s
          s = s.replace(forced, '# Preserve the iPhoneOS SDK selected by the parent toolchain')
          old = 'set(ENV{MACOSX_DEPLOYMENT_TARGET} ${CMAKE_OSX_DEPLOYMENT_TARGET})'
          assert old in s
          s = s.replace(old, 'if (NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\n        ' + old + '\n    endif()')
          p.write_text(s)
          PY
      - name: Attempt iPhoneOS arm64 CMake configuration
        shell: bash
        run: |
          set +e
          echo "Upstream revision: $(git -C upstream rev-parse HEAD)" > ios-configure.log
          cmake -S upstream -B ios-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ios-deps" \
            -DSDL2_DIR="$RUNNER_TEMP/ios-deps/lib/cmake/SDL2" \
            -DOGG_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DOGG_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libogg.a" \
            -DVORBIS_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DVORBIS_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libvorbis.a" \
            -DVORBISFILE_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libvorbisfile.a" \
            -DTHEORA_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DTHEORA_LIBRARY="$RUNNER_TEMP/ios-deps/lib/libtheora.a" \
            -DLZO_INCLUDE_DIR="$RUNNER_TEMP/ios-deps/include" \
            -DLZO_LIBRARY="$RUNNER_TEMP/ios-deps/lib/liblzo2.a" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH >> ios-configure.log 2>&1
          result=$?
          echo "$result" > ios-configure-exit-code.txt
          cat ios-configure.log
          exit 0
      - name: Attempt native engine compilation when configuration succeeds
        shell: bash
        run: |
          set +e
          if [ "$(cat ios-configure-exit-code.txt 2>/dev/null)" = 0 ]; then
            cmake --build ios-build --parallel 2 > ios-build-attempt.log 2>&1
            result=$?
            echo "$result" > ios-build-exit-code.txt
          else
            echo "CMake configuration failed; engine build skipped." > ios-build-attempt.log
            echo skipped > ios-build-exit-code.txt
          fi
          tail -n 120 ios-build-attempt.log
      - name: Report and annotate errors
        if: always()
        shell: bash
        run: |
          config="$(cat ios-configure-exit-code.txt 2>/dev/null || echo unavailable)"
          build="$(cat ios-build-exit-code.txt 2>/dev/null || echo unavailable)"
          {
            echo "### OpenXRay iPhoneOS arm64"
            echo "Configure: $config; compile: $build"
            echo '~~~text'
            grep -Ei 'fatal error:|error:|CMake Error|FAILED:|undefined symbols|ld: error' ios-configure.log ios-build-attempt.log 2>/dev/null | head -n 35 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          (grep -Ei 'fatal error:|error:|CMake Error|FAILED:|undefined symbols|ld: error' ios-configure.log ios-build-attempt.log 2>/dev/null || true) | head -n 10 | while IFS= read -r line; do
            echo "::error title=OpenXRay iOS diagnostic::$line"
          done
          true
      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-cmake-diagnostics
          path: |
            ios-configure.log
            ios-configure-exit-code.txt
            ios-build-exit-code.txt
            ios-build-attempt.log
            ios-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
      - name: Enforce real iOS engine compilation status
        if: always()
        shell: bash
        run: |
          config="$(cat ios-configure-exit-code.txt 2>/dev/null || echo unavailable)"
          build="$(cat ios-build-exit-code.txt 2>/dev/null || echo unavailable)"
          if [ "$config" != 0 ] || [ "$build" != 0 ]; then
            echo "::error::OpenXRay iOS engine not compiled (configure=$config, build=$build)."
            exit 1
          fi
