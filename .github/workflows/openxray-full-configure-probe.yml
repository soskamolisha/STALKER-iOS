      - name: Verify native X-Ray entry point symbol
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then exit 0; fi
          binary="upstream/bin/Release/xr_3da.app/xr_3da"
          /usr/bin/nm -gU "$binary" | grep -F '_main'
          if ! /usr/bin/nm -gU "$binary" | grep -F '_st_xray_embedded_run'; then
            echo "::error::Embedded X-Ray C ABI symbol missing from arm64 executable"
            exit 1
          fi
          echo "Entry-point audit complete."
      - name: Package embedded X-Ray entry-point object for linkage research
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then exit 0; fi
          mkdir -p embedded-entry
          find ios-build -type f \( -name 'entry_point.cpp.o' -o -name 'entry_point.cpp.obj' \) -print > embedded-entry/candidates.txt
          if [ ! -s embedded-entry/candidates.txt ]; then
            echo "::error::Compiled X-Ray entry_point object not found"
            exit 1
          fi
          while IFS= read -r candidate; do
            if /usr/bin/nm -gU "$candidate" 2>/dev/null | grep -q '_st_xray_embedded_run'; then
              cp "$candidate" embedded-entry/entry_point.o
              break
            fi
          done < embedded-entry/candidates.txt
          if [ ! -f embedded-entry/entry_point.o ]; then
            echo "::error::No compiled entry-point object defines the embedded C ABI"
            exit 1
          fi
          /usr/bin/file embedded-entry/entry_point.o | tee embedded-entry/architecture.txt
          if grep -q "LLVM bitcode" embedded-entry/architecture.txt; then
            echo "::notice::Entry-point object is LLVM bitcode (LTO); linking requires compatible Apple Clang LTO settings."
          fi
          /usr/bin/nm -gU embedded-entry/entry_point.o > embedded-entry/exported-symbols.txt
          /usr/bin/nm -u embedded-entry/entry_point.o > embedded-entry/undefined-symbols.txt
          # Preserve the actual engine link command and its static library inputs.
          # The entry-point archive is only a probe; a future embedded target must
          # link the full dependency closure rather than this object alone.
          find ios-build -name link.txt -path '*xr_3da*' -print -exec sh -c 'cat "$1"; echo' sh {} \; > embedded-entry/engine-link-commands.txt
          # This job uses CMake's default Unix Makefiles generator, not Xcode.
          # Capture every generated link.txt so target-specific engine link
          # commands can be located even if the directory name differs.
          find ios-build -type f -name link.txt -print | sort > embedded-entry/all-link-command-paths.txt
          while IFS= read -r linkfile; do
            printf '\n=== %s ===\n' "$linkfile"
            cat "$linkfile"
          done < embedded-entry/all-link-command-paths.txt > embedded-entry/all-link-commands.txt
          echo "CMake link command files: $(wc -l < embedded-entry/all-link-command-paths.txt)"
          # Record the complete native executable link command, including
          # third-party libraries and linker flags, without guessing paths.
          grep -E '/xr_3da/|/xr_3da\\.dir/|/xrEngine/' embedded-entry/all-link-command-paths.txt > embedded-entry/engine-link-candidates.txt || true
          echo "Engine-related link command paths: $(wc -l < embedded-entry/engine-link-candidates.txt)"
          while IFS= read -r linkfile; do
            printf '\n=== %s ===\n' "$linkfile"
            cat "$linkfile"
          done < embedded-entry/engine-link-candidates.txt > embedded-entry/engine-link-command-expanded.txt
          if [ ! -s embedded-entry/engine-link-command-expanded.txt ]; then
            echo "::error::No full engine link command found."
            exit 1
          fi
          echo "Full engine link command captured ($(wc -c < embedded-entry/engine-link-command-expanded.txt) bytes)."
          # Expose the actual command and resolve @response-file references
          # instead of treating a zero-archive count as a missing dependency.
          echo "=== Engine linker invocation ==="
          cat embedded-entry/engine-link-command-expanded.txt
          echo "=== CMake target link metadata ==="
          find ios-build -type f \( -name flags.make -o -name linkLibs.rsp -o -name objects1.rsp \) -path '*xr_3da*' -print -exec sh -c 'cat "$1"; echo' sh {} \; > embedded-entry/engine-link-target-metadata.txt
          head -c 12000 embedded-entry/engine-link-target-metadata.txt || true
          # Parse only xr_3da's executable link command; xrEngine's
          # archive creation is a separate command, not executable linkage.
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          # CMake executes link.txt from the target build directory, not CMakeFiles/*.dir.
          root = Path("ios-build/src/xr_3da")
          link = root / "CMakeFiles/xr_3da.dir/link.txt"
          if not link.is_file():
              raise SystemExit(f"Missing executable link command: {link}")
          command = link.read_text().strip()
          tokens = shlex.split(command)
          expanded = []
          for token in tokens:
              if token.startswith("@"):
                  rsp = root / token[1:]
                  if not rsp.is_file():
                      raise SystemExit(f"Missing linker response file: {rsp}")
                  expanded.extend(shlex.split(rsp.read_text()))
              else:
                  expanded.append(token)
          archives = [t for t in expanded if t.endswith(".a")]
          libraries = [t for t in expanded if t.endswith((".a", ".dylib", ".tbd")) or t.startswith(("-l", "-framework", "-weak_framework", "@"))]
          out = Path("embedded-entry")
          (out / "xr_3da-link-command.txt").write_text(command + chr(10))
          (out / "xr_3da-link-arguments.txt").write_text(chr(10).join(expanded) + chr(10))
          (out / "engine-link-static-archives.txt").write_text(chr(10).join(archives) + chr(10))
          (out / "engine-link-library-inputs.txt").write_text(chr(10).join(libraries) + chr(10))
          (out / "engine-link-token-count.txt").write_text(str(len(expanded)) + chr(10))
          print(f"xr_3da executable link: {len(expanded)} tokens, {len(archives)} static archives, {len(libraries)} library flags")
          if not archives:
              raise SystemExit("No static engine archives in xr_3da executable link command")
          # Resolve the actual archive closure relative to the executable's
          # CMake working directory. Fail if any archive is missing; this
          # prevents generating a misleading embedding manifest.
          resolved = []
          missing = []
          for item in archives:
              archive = Path(item)
              if not archive.is_absolute():
                  archive = root / archive
              archive = archive.resolve()
              if archive.is_file():
                  resolved.append(str(archive))
              else:
                  missing.append(str(archive))
          (out / "xr_3da-resolved-static-archives.txt").write_text(chr(10).join(resolved) + chr(10))
          print(f"Resolved engine archives: {len(resolved)}/{len(archives)}")
          if missing:
              raise SystemExit("Missing engine archives: " + ", ".join(missing))
          # A linkable engine archive must preserve the whole native object
          # closure. Start with a reproducible archive inventory; do not
          # mistake a single entry-point object for a complete engine.
          unique = list(dict.fromkeys(resolved))
          (out / "xr_3da-unique-static-archives.txt").write_text(chr(10).join(unique) + chr(10))
          sizes = [(Path(p).name, Path(p).stat().st_size) for p in unique]
          (out / "xr_3da-archive-sizes.tsv").write_text(
              chr(10).join(f"{name}\\t{size}" for name, size in sizes) + chr(10)
          )
          print(f"Unique engine archives: {len(unique)}; total archive bytes: {sum(size for _, size in sizes)}")
          PY
          # Real native archive merge probe. This validates that the
          # OpenXRay dependency closure can be packaged for static linkage;
          # it does not claim the UIKit lifecycle or SwiftUI integration works.
          engine_archives=()
          while IFS= read -r archive; do
            [ -n "$archive" ] && engine_archives+=("$archive")
          done < embedded-entry/xr_3da-unique-static-archives.txt
          # Include the C ABI entry-point object in the full arm64 engine archive.
          test -s embedded-entry/entry_point.o
          /usr/bin/libtool -static -o embedded-entry/libOpenXRayCombinedProbe.a embedded-entry/entry_point.o "${engine_archives[@]}"
          /usr/bin/nm -gU embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-entry-symbols.txt 2>/dev/null
          if ! grep -q '_st_xray_embedded_run' embedded-entry/combined-entry-symbols.txt; then
            echo "Missing embedded X-Ray C ABI entry point"
            exit 1
          fi
          rm embedded-entry/combined-entry-symbols.txt
          /usr/bin/file embedded-entry/libOpenXRayCombinedProbe.a | tee embedded-entry/combined-archive-type.txt
          /usr/bin/ar -t embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-members.txt
          echo "Combined archive members: $(wc -l < embedded-entry/combined-archive-members.txt)"
          /usr/bin/lipo -info embedded-entry/libOpenXRayCombinedProbe.a | tee embedded-entry/combined-archive-architecture.txt
          if ! grep -q 'arm64' embedded-entry/combined-archive-architecture.txt; then
            echo "::error::Combined OpenXRay archive does not contain arm64"
            exit 1
          fi
          # Validate that this is an engine archive, not merely a collection
          # of unrelated dependencies. The entry-point wrapper remains separate.
          /usr/bin/nm -gU embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-exports.txt 2> embedded-entry/combined-archive-nm-errors.txt
          python3 - <<'PY'
          from pathlib import Path
          symbols = Path("embedded-entry/combined-archive-exports.txt").read_text(errors="replace")
          families = {
              "xrCore": ("xrCore", "xrDebug"),
              "xrEngine": ("CEngine", "CDevice"),
              "xrGame": ("CLevel", "CActor"),
          }
          results = {name: any(token in symbols for token in names) for name, names in families.items()}
          Path("embedded-entry/combined-archive-engine-symbol-audit.txt").write_text(
              chr(10).join(f"{name}: {'present' if present else 'not detected'}" for name, present in results.items()) + chr(10)
          )
          print("Combined archive engine symbol audit:", results)
          if not any(results.values()):
              raise SystemExit("No recognizable OpenXRay engine exports in merged archive")
          PY
          rm embedded-entry/combined-archive-exports.txt
          # Keep diagnostic artifacts lightweight; the merged archive is
          # generated and inspected here, but not uploaded as a huge CI artifact.
          /usr/bin/stat -f '%z' embedded-entry/libOpenXRayCombinedProbe.a > embedded-entry/combined-archive-size-bytes.txt
          # Probe an actual iOS arm64 linker invocation against the merged
          # archive. This intentionally does not claim a runnable UIKit app.
          # The symbol is pulled from the archive by an undefined reference.
          # Bound this experimental link probe so it cannot consume the
          # entire macOS runner budget and cancel the useful engine build.
          python3 - <<'PY'
          import pathlib
          import subprocess
          sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-path"], text=True
          ).strip()
          cmd = [
              "xcrun", "--sdk", "iphoneos", "clang++",
              "-arch", "arm64", "-target", "arm64-apple-ios17.0",
              "-isysroot", sdk, "-Wl,-r", "-Wl,-u,_st_xray_embedded_run",
              "embedded-entry/libOpenXRayCombinedProbe.a",
              "-o", "embedded-entry/engine-partial-link.o",
          ]
          log = pathlib.Path("embedded-entry/engine-partial-link.log")
          try:
              with log.open("wb") as output:
                  result = subprocess.run(
                      cmd, stdout=output, stderr=subprocess.STDOUT, timeout=180,
                      check=False,
                  )
              status = result.returncode
          except subprocess.TimeoutExpired:
              status = 124
              with log.open("ab") as output:
                  output.write(b"\\nLink probe timed out after 180 seconds\\n")
          pathlib.Path("embedded-entry/engine-partial-link-exit-code.txt").write_text(
              str(status) + chr(10)
          )
          print("Partial engine link exit code:", status)
          PY
          partial_link_status="$(cat embedded-entry/engine-partial-link-exit-code.txt)"
          if [ "$partial_link_status" -eq 0 ]; then
            test -s embedded-entry/engine-partial-link.o
            /usr/bin/file embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-type.txt
            /usr/bin/nm -gU embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-symbols.txt
            if ! grep -q '_st_xray_embedded_run' embedded-entry/engine-partial-link-symbols.txt; then
              echo "::error::Partial link succeeded but embedded X-Ray entry point is missing"
              exit 1
            fi
            # A relocatable link can still contain undefined references.
            # Preserve the evidence before deleting the large probe object.
            /usr/bin/nm -u embedded-entry/engine-partial-link.o > embedded-entry/engine-partial-link-undefined-symbols.txt
            grep -c ' U ' embedded-entry/engine-partial-link-undefined-symbols.txt > embedded-entry/engine-partial-link-unresolved-count.txt || true
            echo "Unresolved references after partial link: $(cat embedded-entry/engine-partial-link-unresolved-count.txt)"
            rm embedded-entry/engine-partial-link-symbols.txt
            rm embedded-entry/engine-partial-link.o
          else
            echo "::error::Partial engine link failed with exit code $partial_link_status"
            tail -n 35 embedded-entry/engine-partial-link.log
            exit 1
          fi
          # Keep the compiled engine archive as a reusable integration input.
          # This is NOT a complete, independently linkable iOS game runtime.
          mkdir -p engine-integration
          mv embedded-entry/libOpenXRayCombinedProbe.a engine-integration/libOpenXRayCombinedProbe.a
          /usr/bin/shasum -a 256 engine-integration/libOpenXRayCombinedProbe.a > engine-integration/SHA256SUMS
          # Require the actual embedded entry symbol before publishing a
          # candidate for in-process launcher integration.
          /usr/bin/nm -gU engine-integration/libOpenXRayCombinedProbe.a > engine-integration/exported-symbols.txt
          if ! grep -q '_st_xray_embedded_run' engine-integration/exported-symbols.txt; then
            echo "::error::Missing embedded OpenXRay entry point"
            exit 1
          fi
          # Reject archives without the resource-aware ABI required by the launcher.
          # A legacy-only archive cannot launch imported game assets.
          python3 scripts/verify_openxray_archive.py --require-resources engine-integration/libOpenXRayCombinedProbe.a
          /usr/bin/lipo -verify_arch arm64 engine-integration/libOpenXRayCombinedProbe.a
          /usr/bin/nm -u engine-integration/libOpenXRayCombinedProbe.a > engine-integration/undefined-symbols.txt
          printf 'entry_point=st_xray_embedded_run\\nresource_aware_entry=present\\narchitecture=arm64\\nlink_status=unverified\\nlauncher_integration=no\\n' > engine-integration/integration-status.txt
          rm engine-integration/exported-symbols.txt
          printf '%s\n' 'OpenXRay arm64 object archive for future in-process iOS linkage.' 'Resource-aware ABI present, but iOS runtime and paths with spaces are not yet supported.' 'Not a signed app, complete engine framework, or playable game.' > engine-integration/README.txt
          if [ ! -s embedded-entry/all-link-command-paths.txt ]; then
            echo "::error::No CMake link.txt files found; cannot reconstruct engine linkage."
            exit 1
          fi
          grep '^CMAKE_GENERATOR:' ios-build/CMakeCache.txt > embedded-entry/cmake-generator.txt || true
          # Xcode generators commonly use LinkFileList instead of CMake link.txt.
          find ios-build -type f \( -name '*.LinkFileList' -o -name '*-LinkFileList' \) -print > embedded-entry/xcode-link-filelists.txt
          while IFS= read -r list; do
            printf '\n=== %s ===\n' "$list"
            cat "$list"
          done < embedded-entry/xcode-link-filelists.txt > embedded-entry/xcode-link-inputs.txt
          # CMake's Xcode generator writes the final linker invocation to
          # build logs; retain it alongside LinkFileList for dependency analysis.
          if [ -f ios-build-attempt.log ]; then
            grep -E '(^|[[:space:]])(Ld|Libtool|clang\+\+|/usr/bin/clang\+\+)([[:space:]]|$)' ios-build-attempt.log > embedded-entry/linker-log-excerpts.txt || true
          fi
          echo "Xcode LinkFileList files: $(wc -l < embedded-entry/xcode-link-filelists.txt)"
          echo "Xcode linker inputs (bytes): $(wc -c < embedded-entry/xcode-link-inputs.txt)"
          find ios-build -type f -name '*.a' -print | sort > embedded-entry/static-library-candidates.txt
          echo "Static library candidates: $(wc -l < embedded-entry/static-library-candidates.txt)"
          if [ ! -s embedded-entry/engine-link-commands.txt ]; then
            echo "::warning::No xr_3da link.txt found; Xcode generator may store link instructions elsewhere."
          fi
          printf "Undefined symbols in entry-point object: " | tee embedded-entry/linkage-summary.txt
          wc -l < embedded-entry/undefined-symbols.txt | tee -a embedded-entry/linkage-summary.txt
          echo "An entry-point archive alone cannot be linked as a complete X-Ray engine." | tee -a embedded-entry/linkage-summary.txt
          /usr/bin/libtool -static -o embedded-entry/libXRayEntryPointProbe.a embedded-entry/entry_point.o
          /usr/bin/ar -t embedded-entry/libXRayEntryPointProbe.a
          echo "This archive contains only an entry-point object, NOT a linkable full engine."
      - name: Upload reusable arm64 engine integration archive
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-arm64-integration-archive
          path: engine-integration/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Upload embedded entry-point linkage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-embedded-entry-linkage-probe
          path: embedded-entry/
          if-no-files-found: ignore
          retention-days: 14
      - name: Inspect engine-to-launcher integration interfaces
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then
            echo "Engine not built; integration audit skipped."
            exit 0
          fi
          mkdir -p integration-audit
          {
            echo "OpenXRay iOS engine integration audit"
            echo "Engine binary:"
            /usr/bin/file upstream/bin/Release/xr_3da.app/xr_3da
            echo
            echo "Executable entry points:"
            /usr/bin/nm -gU upstream/bin/Release/xr_3da.app/xr_3da 2>/dev/null | grep -E '(_main$|SDL_main|UIApplicationMain|xrEngine)' | head -n 30 || true
            echo
            echo "Build targets and link commands:"
            find ios-build -name link.txt -path '*xr_3da*' -print -exec sh -c 'head -c 20000 "$1"; echo' sh {} \; || true
            echo
            echo "Existing launcher integration:"
            echo "SwiftUI currently instantiates UnavailableEngine; no native X-Ray runtime linkage."
            echo "The executable cannot be launched as an iOS child process."
            echo "Next engineering task: expose an embeddable runtime entry point and bind it to UIKit/SDL lifecycle."
          } > integration-audit/report.txt
          cat integration-audit/report.txt | head -n 35
      - name: Upload engine integration audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-launcher-integration-audit
          path: integration-audit/report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Package compiled iOS X-Ray engine bundle
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat ios-build-exit-code.txt 2>/dev/null)" != "0" ]; then
            echo "Engine compilation unsuccessful; no engine bundle will be published."
            exit 0
          fi
          bundle="upstream/bin/Release/xr_3da.app"
          test -f "$bundle/xr_3da"
          mkdir -p engine-package
          cp -R "$bundle" engine-package/
          plist="engine-package/xr_3da.app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stalkermobile.openxray.engine' "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stalkermobile.openxray.engine' "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName STALKER X-Ray Test' "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string STALKER X-Ray Test' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
          /usr/bin/file engine-package/xr_3da.app/xr_3da
          /usr/bin/lipo -info engine-package/xr_3da.app/xr_3da
          echo "=== App bundle metadata ==="
          if [ -f engine-package/xr_3da.app/Info.plist ]; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' engine-package/xr_3da.app/Info.plist
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' engine-package/xr_3da.app/Info.plist
            /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' engine-package/xr_3da.app/Info.plist
          else
            echo "::warning::Missing Info.plist; compiled bundle is not yet installable."
          fi
          echo "=== Code signature ==="
          /usr/bin/codesign --verify --verbose=2 engine-package/xr_3da.app || true
          echo "=== Runtime linkage ==="
          /usr/bin/otool -L engine-package/xr_3da.app/xr_3da | tee engine-package/dylib-dependencies.txt
          echo "=== Engine artifact manifest ==="
          /usr/bin/shasum -a 256 engine-package/xr_3da.app/xr_3da | tee engine-package/sha256.txt
          echo "Compiled engine bundle packaged; this is not a signed or launch-tested IPA."
      - name: Package unsigned engine test IPA
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f engine-package/xr_3da.app/xr_3da ]; then
            echo "Engine binary missing; unsigned engine IPA cannot be packaged."
            exit 0
          fi
          mkdir -p ipa-staging/Payload
          cp -R engine-package/xr_3da.app ipa-staging/Payload/
          (cd ipa-staging && /usr/bin/zip -qry ../openxray-engine-unsigned-test.ipa Payload)
          /usr/bin/unzip -t openxray-engine-unsigned-test.ipa | tail -n 2
          echo "Unsigned engine-only IPA created for packaging diagnostics; not signed, not integrated into launcher, not gameplay-tested."
      - name: Upload unsigned engine test IPA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-engine-unsigned-test-ipa
          path: openxray-engine-unsigned-test.ipa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload unsigned iOS X-Ray engine bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-arm64-unsigned-app
          path: engine-package/xr_3da.app/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce real iOS engine compilation status
        if: always()
        shell: bash
        run: |
          config="$(cat ios-configure-exit-code.txt 2>/dev/null || echo unavailable)"
          build="$(cat ios-build-exit-code.txt 2>/dev/null || echo unavailable)"
          if [ "$config" != 0 ] || [ "$build" != 0 ]; then
            echo "::error::OpenXRay iOS engine not compiled (configure=$config, build=$build)."
            exit 1
          fi

