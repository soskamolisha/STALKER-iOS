name: OpenXRay iOS ARM64 Compile Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trilogy-launcher-v3
    paths:
      - '.github/workflows/openxray-ios-experiment.yml'
      - 'Sources/Native/**'
      - 'project.yml'

jobs:
  upstream-ios-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout launcher integration sources
        uses: actions/checkout@v4
        with:
          path: launcher
      - name: Checkout upstream OpenXRay with dependencies
        uses: actions/checkout@v4
        with:
          repository: OpenXRay/xray-16
          ref: dev
          submodules: recursive
          path: upstream
      - name: Validate launcher engine ABI against upstream exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          expected = ("st_xray_embedded_run_with_resources", "st_xray_embedded_run")
          root = Path("upstream")
          report = Path(os.environ["RUNNER_TEMP"]) / "openxray-abi-audit.txt"
          candidates = []
          for path in root.rglob("*"):
              if path.suffix not in (".h", ".hpp", ".c", ".cc", ".cpp", ".mm"):
                  continue
              if len(path.parts) > 12:
                  continue
              try:
                  contents = path.read_text(errors="replace")
              except OSError:
                  continue
              for symbol in expected:
                  if symbol in contents:
                      candidates.append(f"{symbol}: {path}")
          report.write_text("\\n".join(candidates) if candidates else
                            "No launcher ABI entry points found in upstream source. An iOS adapter must be implemented.")
          print(report.read_text())
          launcher = Path("launcher/Sources/Native/STOpenXRayRuntime.cpp").read_text()
          assert all(symbol in launcher for symbol in expected)
          PY
      - name: Report SDK and upstream revision
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          git -C upstream rev-parse HEAD
      - name: Check upstream build requirements and iOS compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path("upstream")
          report = Path(os.environ["RUNNER_TEMP"]) / "openxray-requirements.txt"
          cmake = root / "CMakeLists.txt"
          with report.open("w") as output:
              print("Upstream CMakeLists.txt:", cmake.exists(), file=output)
              print("iOS-related CMake references:", file=output)
              for path in root.rglob("*.cmake"):
                  if len(path.parts) > 9:
                      continue
                  try:
                      lines = path.read_text(errors="replace").splitlines()
                  except OSError:
                      continue
                  for line_number, line in enumerate(lines, 1):
                      if "IOS" in line or "iOS" in line or "APPLE" in line:
                          print(f"{path}:{line_number}: {line[:180]}", file=output)
              print("Launcher requires st_xray_embedded_run_with_resources export.", file=output)
          print(report.read_text()[:12000])
          PY
      - name: Attempt CMake configuration for iPhone ARM64
        id: configure
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S upstream -B "$RUNNER_TEMP/openxray-ios" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DXRAY_USE_LUAJIT=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$RUNNER_TEMP/openxray-configure.log"
      - name: Attempt upstream iOS compilation
        if: steps.configure.outcome == 'success'
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build "$RUNNER_TEMP/openxray-ios" --config Release --parallel 3 \
            -- -quiet CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/openxray-compile.log"
      - name: Inspect produced ARM64 static libraries and engine entry points
        if: steps.compile.outcome == 'success'
        id: inspect
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "openxray-ios"
          # OpenXRay sets its own output directory under upstream/bin.\n          # Inspect both that directory and the CMake build tree.\n          libraries = sorted(set(root.rglob("*.a")) | set(Path("upstream/bin").rglob("*.a")))
          report = Path(os.environ["RUNNER_TEMP"]) / "openxray-linkage.txt"
          with report.open("w") as out:
              print(f"Static libraries: {len(libraries)}", file=out)
              for library in libraries:
                  print(f"\\n{library}", file=out)
                  result = subprocess.run(["xcrun", "lipo", "-info", str(library)],
                                          capture_output=True, text=True)
                  print((result.stdout or result.stderr).strip(), file=out)
              print("\\nRequired launcher ABI:", file=out)
              print("st_xray_embedded_run_with_resources(const char*, const char*)", file=out)
              print("This upstream build is not linked to the launcher ABI.", file=out)
          print(report.read_text())
          if not libraries:
              raise SystemExit("No static libraries produced; inspect build outputs")
          PY
      - name: Summarize first native compiler and CMake failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          temp = Path(os.environ["RUNNER_TEMP"])
          patterns = re.compile(r"(fatal error:| error:|CMake Error|Could NOT find|No such file or directory|unsupported|not supported|undefined symbol|ld:)", re.I)
          report = temp / "openxray-failure-summary.txt"
          with report.open("w") as out:
              for name in ("openxray-configure.log", "openxray-compile.log"):
                  log = temp / name
                  print(f"=== {name} ===", file=out)
                  if not log.exists():
                      print("No log: stage was skipped or failed before producing output.", file=out)
                      continue
                  matches = [(i, line.strip()) for i, line in enumerate(log.read_text(errors="replace").splitlines(), 1)
                             if patterns.search(line)]
                  if not matches:
                      print("No recognized errors; inspect full log.", file=out)
                  for line_number, line in matches[:80]:
                      print(f"{line_number}: {line[:350]}", file=out)
          print(report.read_text())
          PY
      - name: Record native build results
        if: always()
        run: |
          echo "Configure outcome: ${{ steps.configure.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Compile outcome: ${{ steps.compile.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static library inspection: ${{ steps.inspect.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This experiment does not produce a playable iOS engine or integrate it into the launcher." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-arm64-diagnostics
          path: |
            ${{ runner.temp }}/openxray-abi-audit.txt
            ${{ runner.temp }}/openxray-requirements.txt
            ${{ runner.temp }}/openxray-configure.log
            ${{ runner.temp }}/openxray-compile.log
            ${{ runner.temp }}/openxray-linkage.txt
            ${{ runner.temp }}/openxray-failure-summary.txt
            ${{ runner.temp }}/openxray-ios/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
      - name: Upload compiled OpenXRay libraries for integration
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: openxray-ios-arm64-static-libraries
          path: |
            upstream/bin/**/*.a
            ${{ runner.temp }}/openxray-ios/**/*.a
          if-no-files-found: error
          retention-days: 7
      - name: Mark experiment unsuccessful if configure or compile failed
        if: always()
        run: |
          test "${{ steps.configure.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
          test "${{ steps.inspect.outcome }}" = "success"
