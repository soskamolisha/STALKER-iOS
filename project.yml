name: STALKERiOSStarter
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    SWIFT_OBJC_BRIDGING_HEADER: "Sources/Native/Bridge.h"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  STALKERiOSStarter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stalkermobilestarter
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        # Optional upstream OpenXRay static archive. Leave unset for the
        # lightweight launcher; never treat the archive as a playable engine.
        # A weak entry reference alone will not pull objects from a .a file.
        OTHER_LDFLAGS: "$(inherited) $(OPENXRAY_ARCHIVE_LINK_FLAGS)"
